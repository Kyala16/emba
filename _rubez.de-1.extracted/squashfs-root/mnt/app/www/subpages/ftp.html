<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/ftp.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/ftp.js"></script>
</head>
<body>
<div id="div_ftp_main">
    <div id="div_ftp_tablebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_table_ftp" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_table_ftp_text" class="cls_tablebar_item_text">FTP</div>
        </div>
    </div>
    <div id="div_ftp_content">
        <div id="div_ftp_server" class="cls_ftp_item">
            <div id="div_ftp_server_name" class="cls_ftp_item_name">Server Address</div>
            <div id="div_ftp_server_value" class="cls_ftp_item_value">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input id="input_ftp_server_address" type="text" class="cls_subpage_content_input" style="float: left;border: none;">
                </div>
            </div>
        </div>
        <div id="div_ftp_port" class="cls_ftp_item">
            <div id="div_ftp_port_name" class="cls_ftp_item_name">Server Port</div>
            <div id="div_ftp_port_value" class="cls_ftp_item_value">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input id="input_ftp_port" type="text" class="cls_subpage_content_input" style="float: left;border: none;">
                </div>
            </div>
            <div id="div_ftp_port_range" class="cls_ftp_item_declare cls_item_font_grey">(1~65535)</div>
        </div>
        <div id="div_ftp_user" class="cls_ftp_item">
            <div id="div_ftp_user_name" class="cls_ftp_item_name">User Name</div>
            <div id="div_ftp_user_value" class="cls_ftp_item_value">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input id="input_ftp_user" type="text" class="cls_subpage_content_input" style="float: left;border: none;">
                </div>
            </div>
        </div>
        <div id="div_ftp_password" class="cls_ftp_item">
            <div id="div_ftp_password_name" class="cls_ftp_item_name">Password</div>
            <div id="div_ftp_password_value" style="width: 230px;float: left;">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input id="input_ftp_password" type="password" class="cls_subpage_content_input" style="float: left;border: none;">
                    <div id="div_password_eye" style="float: left;margin-left: 6px;">
                        <img class="cls_input_icon" id="password_eye_hide" onclick="fun_password_eye_showorhide(0)" style="margin-top: 6px;" src="../ui/images/weyehide.png">
                        <img class="cls_input_icon" id="password_eye_show" onclick="fun_password_eye_showorhide(1)" style="margin-top: 6px;" src="../ui/images/eyeshow.png" hidden>
                    </div>
                </div>
            </div>
        </div>
        <div id="div_ftp_remote_path" class="cls_ftp_item">
            <div id="div_ftp_remotepath_name" class="cls_ftp_item_name">Remote Path</div>
            <div id="div_ftp_remotepath_value" class="cls_ftp_item_value">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input id="input_ftp_remotepath" type="text" class="cls_subpage_content_input" style="float: left;border: none;">
                </div>
            </div>
        </div>
        <div id="div_ftp_breakpoint" class="cls_ftp_item" style="height: 24px;">
            <input id="check_enable_ftp_breakpoint" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
            <div style="float: left;height: 24px;">
                <label id="div_ftp_breakpoint_name" for="check_enable_ftp_breakpoint" class="cls_item_mini_font cls_item_font_light">Breakpoint</label>
            </div>
        </div>
        <div id="div_ftp_options" class="cls_ftp_item" style="margin:10px 0 0 0;">
            <input type="button" id="button_ftp_restore" class="cls_subpage_content_button" value="Reset Default">
            <input type="button" id="button_ftp_test" class="cls_subpage_content_button" value="Test FTP">
            <input type="button" id="button_ftp_save" class="cls_subpage_content_button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
