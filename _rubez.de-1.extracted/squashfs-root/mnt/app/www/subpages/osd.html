<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="css/osd.css" />
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/ajaxfileupload.js"></script>
    <script src="../script/translator.js"></script>
    <script src="/script/flvplayer/mpegts.js" charset="utf-8"></script>
    <link rel="stylesheet" media="all" href="/ui/css/mpegts.css" />
    <script src="script/osd.js"></script>
  </head>
  <body>
    <div id="div_osd_main">
      <div id="div_osd_titlebar" style="width: 100%; height: 36px; float: left">
        <div id="div_title_osd" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb; color: white">
          <div id="div_title_osd_text" class="cls_tablebar_item_text">OSD</div>
        </div>
      </div>
      <div id="div_osd_content">
        <div id="div_osd_video_view">
          <div id="div_osd_video_player"></div>
          <div id="div_osd_show">
            <canvas id="canvas_osd_show"></canvas>
          </div>
        </div>
        <div id="div_osd_operations">
          <div id="div_osd_enable_sysinfo" class="cls_osd_enable_item">
            <input type="checkbox" id="check_enable_sysinfo" class="cls_schedule_radio" style="margin-left: 0" />
            <div style="float: left; height: 24px; width: 600px">
              <label id="label_enable_sysinfo" for="check_enable_sysinfo" class="cls_item_mini_font cls_item_font_light" style="color: #cd3333">Display Device Information</label>
            </div>
          </div>
          <div id="div_osd_enable_systime" class="cls_osd_enable_item">
            <input type="checkbox" id="check_enable_systime" class="cls_schedule_radio" style="margin-left: 0" />
            <div style="float: left; height: 24px; width: 600px">
              <label id="label_enable_systime" for="check_enable_systime" class="cls_item_mini_font cls_item_font_light" style="color: #9932cc">Display Datetime</label>
            </div>
          </div>
          <div id="div_osd_enable_custom" class="cls_osd_enable_item">
            <div style="float: left; margin-top: 3px">
              <input type="checkbox" id="check_enable_custom" class="cls_schedule_radio" style="margin-left: 0" />
              <div style="float: left; height: 24px; width: 220px">
                <label id="label_enable_custom" for="check_enable_custom" class="cls_item_mini_font cls_item_font_light" style="color: #b3ee3a">Display Custom</label>
              </div>
            </div>
            <div style="float: left">
              <input type="text" class="cls_subpage_content_input" maxlength="65" id="input_custom_text" />
            </div>
          </div>
          <div id="div_osd_enable_picture" class="cls_osd_enable_item" style="display: none">
            <div style="float: left; margin-top: 6px">
              <input type="checkbox" id="check_enable_picture" class="cls_schedule_radio" style="margin-left: 0" />
              <div style="float: left; height: 24px; width: 220px">
                <label id="label_enable_picture" for="check_enable_picture" class="cls_item_mini_font cls_item_font_light" style="color: #63b8ff">Display Picture</label>
              </div>
            </div>
            <div style="float: left">
              <input type="text" class="cls_subpage_content_input" id="input_osd_picture_path" disabled="disabled" />
              <input type="file" id="input_osd_picture_select" style="display: none" />
              <input type="button" id="button_osd_picture_browse" class="cls_subpage_content_button" style="margin-left: 6px; width: 125px" value="Browse..." />
              <input type="button" id="button_osd_picture_upload" class="cls_subpage_content_button" value="Upload" style="width: 125px" />
            </div>
            <div id="div_logo_file_limit" class="cls_item_mini_font cls_item_font_grey">
              <p id="pnote_picture_type" style="margin-top: 0">
                Notice:1.The picture should be less than 50*50 pixel of size with JPG format.<br />
                2.For more information,please refer to Help.
              </p>
            </div>
          </div>
        <div id="div_osd_enable_4g" class="cls_osd_enable_item">
          <input type="checkbox" id="check_enable_4g" class="cls_schedule_radio" style="margin-left: 0" />
          <div style="float: left; height: 24px; width: 255px">
            <label id="label_enable_4g" for="check_enable_4g" class="cls_item_mini_font cls_item_font_light" style="color: #df2f36">4G</label>
          </div>
          <div style="float: left">
            <input type="button" id="button_osd_4g_clear" class="cls_subpage_content_button" value="Clear" style="width: 125px" onclick="mobile_clear_flow_count()"/>
          </div>
        </div>
      </div>
        <div id="div_osd_params">
          <input type="button" id="button_osd_restore_default" class="cls_subpage_content_button" value="Restore Default" />
          <input type="button" id="button_osd_save" class="cls_subpage_content_button" value="Save" />
        </div>
      </div>
    </div>
  </body>
</html>
