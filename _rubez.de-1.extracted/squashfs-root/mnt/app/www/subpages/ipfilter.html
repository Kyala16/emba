<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <link rel="stylesheet" media="all" href="css/ipfilter.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/ipaddredit.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/ipfilter.js"></script>
</head>
<body>
<div id="div_ipfilter_main">
    <div id="div_ipfilter_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_ipfilter" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_ipfilter_text" class="cls_tablebar_item_text">IP Filtering</div>
        </div>
    </div>
    <div id="div_ipfilter_content">
        <div id="div_ipfilter_enable" class="cls_ipfilter_item" style="height: 24px;">
            <input id="check_enable_ipfilter" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
            <div style="float: left;height: 24px;">
                <label id="div_ipfilter_enable_name" for="check_enable_ipfilter" class="cls_item_mini_font cls_item_font_light">Enable</label>
            </div>
        </div>
        <div id="div_ipfilter_mode" class="cls_ipfilter_item">
            <div id="div_ipfilter_mode_name" class="cls_ipfilter_item_name">Authentication</div>
            <div id="div_ipfilter_mode_value" class="cls_ipfilter_item_value">
                <select id="select_ipfilter_mode" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">Allow</option>
                    <option value="1">Deny</option>
                </select>
            </div>
        </div>
        <div id="div_ipfilter_list">
            <div id="div_ipfilter_list_header">
                <table style="border: 1px solid black;width: 100%;height: 24px;">
                    <tbody>
                    <tr style="padding: 0;">
                        <th class="cls_ipfilter_list_header_item" id="list_column_startip" style="border-right: 1px solid black;">Start IP</th>
                        <th class="cls_ipfilter_list_header_item" id="list_column_endip" style="border-right: 1px solid black;">End IP</th>
                        <th class="cls_ipfilter_list_header_item" id="list_column_alias" style="width: 190px;">Alias</th>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div id="div_ipfilter_list_content">
                <div id="div_ipfilter_list_items" class="cls_scrollbar">
                    <table>
                        <tbody id="table_ipfilter_list" style="width: 160px">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="div_add_or_modify_dialog" style="display: none;">
            <div id="div_dialog_content">
                <div id="div_ipfilter_alias" class="cls_ipfilter_dialog_item">
                    <div id="div_ipfilter_alias_name" class="cls_ipfilter_dialog_item_name">Alias</div>
                    <div id="div_ipfilter_alias_value" class="cls_ipfilter_dialog_item_value">
                        <input type="text" id="input_ipfilter_alias_text" maxlength="30" class="cls_subpage_content_input" style="width: 160px;">
                    </div>
                </div>
                <div id="div_ipfilter_start" class="cls_ipfilter_dialog_item">
                    <div id="div_ipfilter_start_name" class="cls_ipfilter_dialog_item_name">Start IP</div>
                    <div id="div_ipfilter_start_value" class="cls_ipfilter_dialog_item_value">
                        <div id="ipedit_ipfilter_start" class="cls_ipedit_container"></div>
                    </div>
                </div>
                <div id="div_ipfilter_end" class="cls_ipfilter_dialog_item">
                    <div id="div_ipfilter_end_name" class="cls_ipfilter_dialog_item_name">End IP</div>
                    <div id="div_ipfilter_end_value" class="cls_ipfilter_dialog_item_value">
                        <div id="ipedit_ipfilter_end" class="cls_ipedit_container"></div>
                    </div>
                </div>
                <div id="div_ipfilter_submask" class="cls_ipfilter_dialog_item">
                    <div id="div_ipfilter_submask_name" class="cls_ipfilter_dialog_item_name">Submask</div>
                    <div id="div_ipfilter_submask_value" class="cls_ipfilter_dialog_item_value">
                        <div id="ipedit_ipfilter_submask" class="cls_ipedit_container"></div>
                    </div>
                </div>
                <div id="div_ipfilter_buttons">
                    <input type="button" id="button_ipfilter_dialog_save"   class="cls_subpage_content_button" value="Save">
                    <input type="button" id="button_ipfilter_dialog_cancel" class="cls_subpage_content_button" value="Cancel">
                </div>
            </div>
        </div>
        <div id="div_ipfilter_options">
            <input type="button" id="button_ipfilter_add"    class="cls_subpage_content_button" value="Add">
            <input type="button" id="button_ipfilter_modify" class="cls_subpage_content_button" value="Modify">
            <input type="button" id="button_ipfilter_delete" class="cls_subpage_content_button" value="Delete">
        </div>
    </div>
</div>
</body>
</html>
