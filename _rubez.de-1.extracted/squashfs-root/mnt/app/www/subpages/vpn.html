<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="css/vpn.css" />
    <script src="../script/jquery-1.12.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/jquery.cookie.js"></script>
    <script src="/script/ipaddredit.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/vpn.js"></script>
  </head>
  <body>
    <div id="div_vpn_main">
      <div id="div_vpn_titlebar" style="width: 100%; height: 36px; float: left">
        <div id="div_title_vpn" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb; color: white">
          <div id="div_title_vpn_text" class="cls_tablebar_item_text">L2TP VPN</div>
        </div>
      </div>
      <div id="div_vpn_content">
        <div id="div_vpn_enable" class="cls_vpn_item" style="height: 24px">
          <input id="check_enable_vpn" type="checkbox" class="cls_schedule_radio" style="margin-left: 0" />
          <div style="float: left; height: 24px">
            <label id="label_enable_vpn_declare" for="check_enable_vpn" class="cls_item_mini_font cls_item_font_light">Enable</label>
          </div>
        </div>
        <div id="div_vpn_name" class="cls_vpn_item">
          <div id="div_vpn_name_name" class="cls_vpn_item_name cls_item_font_light cls_item_mini_font">Name</div>
          <div id="div_vpn_name_value" style="float: left">
            <div style="width: 230px; height: 22px; background-color: #2f2f2f; border: 1px solid #242424">
              <input type="text" class="cls_subpage_content_input" id="input_name" maxlength="32" style="float: left; border: none" />
            </div>
          </div>
        </div>
        <div id="div_vpn_serveraddr" class="cls_vpn_item">
          <div id="div_vpn_serveraddr_name" class="cls_vpn_item_name cls_item_font_light cls_item_mini_font">Server address</div>
          <div id="div_vpn_serveraddr_value" style="float: left">
            <div style="width: 230px; height: 22px; background-color: #2f2f2f; border: 1px solid #242424">
              <input type="text" class="cls_subpage_content_input" id="input_serveraddr" maxlength="32" style="float: left; border: none" />
            </div>
          </div>
        </div>
        <div id="div_vpn_username" class="cls_vpn_item">
          <div id="div_vpn_username_name" class="cls_vpn_item_name cls_item_font_light cls_item_mini_font">User Name:</div>
          <div id="div_vpn_username_value" style="float: left">
            <div style="width: 230px; height: 22px; background-color: #2f2f2f; border: 1px solid #242424">
              <input type="text" class="cls_subpage_content_input" id="input_username" maxlength="32" style="float: left; border: none" />
            </div>
          </div>
        </div>
        <div id="div_vpn_password" class="cls_vpn_item">
          <div id="div_vpn_password_name" class="cls_vpn_item_name cls_item_font_light cls_item_mini_font">Password:</div>
          <div id="div_vpn_password_value" style="float: left">
            <div style="width: 230px; height: 22px; background-color: #2f2f2f; border: 1px solid #242424">
              <input type="password" class="cls_subpage_content_input" id="input_password" maxlength="32" style="float: left; border: none" />
              <div id="div_password_eye" style="float: left; margin-left: 6px">
                <img class="cls_input_icon" id="password_eye_hide" onclick="fun_password_eye_showorhide(0)" style="margin-top: 6px" src="../ui/images/weyehide.png" />
                <img class="cls_input_icon" id="password_eye_show" onclick="fun_password_eye_showorhide(1)" style="margin-top: 6px" src="../ui/images/eyeshow.png" hidden />
              </div>
            </div>
          </div>
        </div>
        <div id="div_vpn_connectstatus" class="cls_vpn_item" style="height: 24px; line-height: 24px">
          <div id="div_vpn_connectstatus_name" class="cls_vpn_item_name cls_item_font_light cls_item_mini_font">Connect Status:</div>
          <div id="div_vpn_connectstatus_value" class="cls_item_mini_font cls_item_font_grey"></div>
        </div>
        <div id="div_vpn_options" class="cls_vpn_item" style="margin-top: 10px">
          <input type="button" class="cls_subpage_content_button" id="button_vpn_restore" value="Restore" />
          <input type="button" class="cls_subpage_content_button" id="button_vpn_refresh" value="Refresh" />
          <input type="button" class="cls_subpage_content_button" id="button_vpn_save" value="Save" />
        </div>
      </div>
    </div>
  </body>
</html>
