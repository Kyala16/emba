<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>IP Camera</title>
  <link rel="stylesheet" media="all" href="ui/css/common.css" />
  <link rel="stylesheet" media="all" href="ui/css/playback.css" />
  <link rel="stylesheet" media="all" href="script/jqueryui/jquery-ui.min.css" />
  <link rel="stylesheet" media="all" href="script/jqueryui/datepicker.css" />
  <script src="script/jquery-3.5.1.min.js" type="text/javascript"></script>
  <script src="script/jqueryui/jquery-ui.min.js"></script>
  <script src="script/jqueryui/datepicker-zh.js"></script>
  <script src="script/jqueryui/datepicker-ru.js"></script>
  <script src="script/jqueryui/datepicker-pl.js"></script>
  <script src="script/jqueryui/datepicker-ja.js"></script>
  <script src="script/jqueryui/datepicker-de.js"></script>
  <link rel="stylesheet" media="all" href="/ui/css/mpegts.css" />
  <script src="/script/flvplayer/mpegts.js" charset="utf-8"></script>

  <script src="script/bvipccgisdk.js"></script>
  <script src="script/playback.js" type="text/javascript"></script>
  <script src="script/translator.js"></script>
  <script src="/script/timeline.js"></script>
</head>

<body style="background-color: #2c2c2c">
  <div id="div_main" class="div_main">
    <!--主菜单区域-->
    <div id="div_tatlebar" class="div_titlebar">
      <div id="div_logo" class="div_logo">
        <img height="30" width="auto" src="/ui/images/logo1.png" style="margin: 6px 0 0 20px" />
      </div>
      <div id="div_main_menu" style="float: left">
        <div id="div_preview" class="div_main_button cls_bold_font">Live View</div>
        <div id="div_playback" class="div_main_button cls_bold_font">Playback</div>
        <div id="div_configuration" class="div_main_button cls_bold_font">Configuration</div>
      </div>
      <div id="div_login_info" class="div_user_info">
        <div id="div_loginout" style="margin-right: 16px">
          <div id="img_btnexit_text" style="width: auto; float: right; margin-right: 6px; padding-left: 6px; height: 16px; margin-top: 1px; cursor: pointer">Exit</div>
          <img src="ui/images/logout.png" id="img_btn_exit" style="margin-right: 0; cursor: pointer; margin-top: 0" class="div_userinfo_button" width="16" height="16" />
        </div>
        <div id="div_logininfo_spacer" style="width: 28px" class="div_userinfo_button"></div>
        <div id="div_user_name"><span id="span_username" style="float: right"></span><img src="ui/images/admin.png" style="margin-right: 6px; margin-top: 0" class="div_userinfo_button" width="16" height="16" /></div>
      </div>
    </div>
    <!--网页内容-->
    <div id="div_configuration_content" class="div_content" style="float: left">
      <div id="div_playback_media_area" style="float: left">
        <!--视频窗口-->
        <div id="div_playback_window_area" class="cls_playback_window_area"></div>
        <!--播放控制-->
        <div id="div_playback_control_area">
          <div id="div_playback_control_buttons">
            <img class="img_button_cut" id="button_playback_control_stop" src="/ui/images/playback/stop.png" />
            <img class="img_button_cut" id="button_playback_control_slow" src="/ui/images/playback/slow.png" style="display: none"/>
            <img class="img_button_cut" id="button_playback_control_play" src="/ui/images/playback/play.png" style="display: none"/>
           	<img class="img_button_cut" id="button_playback_control_pause" src="/ui/images/playback/pause.png" style="display: none" />
            <img class="img_button_cut" id="button_playback_control_fast" src="/ui/images/playback/fast.png" style="display: none"/>
            <img class="img_button_cut" id="button_playback_control_frame" src="/ui/images/playback/frame.png" style="display: none"/>
          	 <div id="div_playspeed_declare" style="width: 42px; height: 24px; margin: 12px 0 0 42px; color: white; float: left; font-size: 14px"></div>
          	 <img class="img_button_cut_right" id="button_playback_control_download" src="/ui/images/playback/download.png" style="display: none" />
            <img class="img_button_cut_right" id="button_playback_control_fullscreen" src="/ui/images/videocontrol/fullscreen.png" style="display: none"/>
            <img class="img_button_cut_right" id="button_playback_control_clipvideo" src="/ui/images/playback/clip.png" style="display: none"/>
          	 <img class="img_button_cut_right" id="button_playback_control_speakeron" src="/ui/images/videocontrol/volume.png" style="display: none" />
            <img class="img_button_cut_right" id="button_playback_control_speakeroff" src="/ui/images/videocontrol/mute.png" style="display: none"/>
         	</div>
		  
          <div id="div_slider_volume" style="float: right;position: absolute;bottom:120px;right: 215px;display: none;">
            <div id="div_slider_volume_customhandle" class="ui-slider-handle"></div>
          </div>
		  
          <div id="div_playback_control_timeline">
            <div id="div_playback_control_timeline_content"></div>
          </div>
          <div id="div_playback_control_section_declare">
            <div id="div_playback_timeline_control">
              <img class="img_button_cut_min" id="button_playback_control_strink" src="/ui/images/playback/shrink.png" />
              <img class="img_button_cut_min" id="button_playback_control_stretch" src="/ui/images/playback/stretch.png" />
            </div>
            <div id="div_playback_video_type_manual" class="cls_video_type_declare" style="margin-right: 42px; display: none">
              <div id="div_manual_color_piece" class="cls_video_type_color_piece" style="background-color: #ffa500"></div>
              <div id="div_manual_color_piece_decl" class="cls_video_type_color_decl">Manual</div>
            </div>
            <!-- nomoal -->
            <div id="div_playback_video_type_alarm" class="cls_video_type_declare" style="margin-right: 42px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece" class="cls_video_type_color_piece" style="background-color: #f55e23"></div>
              <div id="div_alarm_color_piece_decl" class="cls_video_type_color_decl">Alarm</div>
            </div>
            <!--  -->
            <div id="div_playback_video_type_alarm_petdetect" class="cls_video_type_declare" style="margin-right: 12px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece_petdetect" class="cls_video_type_color_piece" style="background-color: #bdff07"></div>
              <div id="div_alarm_color_piece_decl_petdetect" class="cls_video_type_color_decl">petdetect</div>
            </div>
            <div id="div_playback_video_type_alarm_vehicledetect" class="cls_video_type_declare" style="margin-right: 12px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece_vehicledetect" class="cls_video_type_color_piece" style="background-color: #e79547"></div>
              <div id="div_alarm_color_piece_decl_vehicledetect" class="cls_video_type_color_decl">vehicledetect</div>
            </div>
            <div id="div_playback_video_type_alarm_facedetection" class="cls_video_type_declare" style="margin-right: 12px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece_facedetection" class="cls_video_type_color_piece" style="background-color: #12fc31"></div>
              <div id="div_alarm_color_piece_decl_facedetection" class="cls_video_type_color_decl">facedetection</div>
            </div>
            <div id="div_playback_video_type_alarm_human" class="cls_video_type_declare" style="margin-right: 12px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece_human" class="cls_video_type_color_piece" style="background-color: #c835ec"></div>
              <div id="div_alarm_color_piece_decl_human" class="cls_video_type_color_decl">Human</div>
            </div>
            <div id="div_playback_video_type_alarm_motion" class="cls_video_type_declare" style="margin-right: 12px;display: flex;align-items: center;justify-content: center;">
              <div id="div_alarm_color_piece_motion" class="cls_video_type_color_piece" style="background-color: #30dce9"></div>
              <div id="div_alarm_color_piece_decl_motion" class="cls_video_type_color_decl">motion detect</div>
            </div>
            <div id="div_playback_video_type_schedule" class="cls_video_type_declare" style="display: flex;align-items: center;justify-content: center;">
              <div id="div_schedule_color_piece" class="cls_video_type_color_piece" style="background-color: #6495ed"></div>
              <div id="div_schedule_color_piece_decl" class="cls_video_type_color_decl">Continuous</div>
            </div>
          </div>
        </div>
      </div>
      <!--文件搜索-->
      <div id="div_playback_filelist_area">
        <div id="div_playback_calender" class="ll-skin-lugo"></div>
        <input type="button" value="Search" id="button_search_record_file" class="cls_subpage_content_button" style="width: 216px; margin-left: 4px; margin-top: 1px" />
      </div>
      <div id="div_record_file_download" style="display: none"></div>
    </div>
    <div id="div_declare" class="div_declare">
      <div id="div_declare_text" style="width: 100%; height: 32px; text-align: center; padding-top: 8px; float: left; font-size: 12px">©2025, RVI All Rights Reserved.</div>
    </div>
  </div>
</body>

</html>
