<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/automaintain.css">
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/ajaxfileupload.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="script/automaintain.js"></script>
    <script src="../script/translator.js"></script>
</head>
<body>
    <div id="div_automaintain_main">
        <div id="div_automaintain_tablebar" style="width: 100%;height: 36px;float: left;">
            <div id="div_table_automaintain" class="cls_tablebar_item" style="border-bottom: 4px solid rgb(123, 185, 51);color:white;">
                <div id="div_table_datetime_text" class="cls_tablebar_item_text">Auto Maintain</div>
            </div>
        </div>
        <div id="div_system_manage">
            <div id="div_autoreboot_title" class="cls_subpage_content_title" style="margin-left: 10px; height: 28px;width: 660px;float: left">
                <div id="div_autoreboot_title_text" style="margin: 0 0 0 12px;font-size: 14px;" class="cls_item_font_light cls_item_mini_font">Auto Reboot</div>
            </div>
            <div id="div_sysmgr_auto_reboot">
                <div id="div_check_auto_reboot">
                    <input id="check_auto_reboot_enable" class="cls_schedule_radio" style="float: left;" type="checkbox">
                    <div id="div_check_auto_reboot_text" style="width: 140px;height: 24px;float: left;">
                        <label id="check_autoreboot_text" class="cls_item_font_light cls_item_mini_font" for="check_auto_reboot_enable">Auto reboot</label>
                    </div>
                </div>
                <select id="select_weekday" style="width: 120px;float: left;margin-top: 10px">
                    <option value="1">Everyday</option>
                    <option value="2">Monday</option>
                    <option value="3">Tuesday</option>
                    <option value="4">Wednesday</option>
                    <option value="5">Thursday</option>
                    <option value="6">Friday</option>
                    <option value="7">Saturday</option>
                    <option value="8">Sunday</option>
                </select>
                <div id="timer_auto_reboot_time" style="color: #ffffff;width: 100px;height: 20px;background-color: #323232;margin:10px 0 0 6px;float: left"></div>
            </div>
            <div style="width: 100%;height: 48px;float: left;">
                <input type="button" id="button_reboot_restore" class="cls_subpage_content_button" style="margin: 5px 0 0 22px;width: 170px;" value="Restore Default">
                <input type="button" id="button_reboot_refresh" class="cls_subpage_content_button" style="width: 170px;" value="Refresh">
                <input type="button" id="button_reboot_save" class="cls_subpage_content_button" style="width: 170px;" value="Save">
            </div>
            <div id="div_device_maintain_title" class="cls_subpage_content_title" style="margin-left: 10px; height: 28px;width: 660px;float: left">
                <div id="div_device_maintain_title_text" style="margin: 0 0 0 12px;font-size: 14px;" class="cls_item_font_light cls_item_mini_font">Device maintain</div>
            </div>
            <div id="div_sysmgr_buttons" style="width: 660px;height: 125px;float: left">
                <div style="width: 100%;height: 35px;float: left;">
                    <input id="button_reboot_device" class="cls_subpage_content_button cls_sysmanage_buttons" style="width: 200px;" type="button" value="Reboot">
                    <p id="pnote_reboot" class="cls_item_font_grey cls_item_mini_font" style="height: 30px;line-height: 30px;float: left;margin: 10px 0 0 2px;">Reboot the device.</p>
                </div>
                <!-- <div style="width: 100%;height: 35px;float: left;">
                    <input id="button_restore_default_setting" class="cls_subpage_content_button cls_sysmanage_buttons" style="width: 200px;" type="button" value="Restore">
                    <p id="pnote_restore_default" class="cls_item_font_grey cls_item_mini_font" style="height: 30px;line-height: 30px;float: left;margin: 10px 0 0 2px;">Restore all of the parameters except IP to default settings.</p>
                </div> -->
            </div>
        </div>
    </div>
    <div id="div_reboot_tips" style="display: none;">
        <div id="div_reboot_tips_content">
            Change the setting will cause that the device will reboot. Do you want to continue?
        </div>
        <div id="div_reboot_tips_options">
            <input type="button" id="button_tips_dialog_confirm" value="Confirm" class="cls_subpage_content_button">
            <input type="button" id="button_tips_dialog_cancel"  value="Cancel"  class="cls_subpage_content_button">
        </div>
    </div>
    <a id="link" style="visibility: hidden;"></a>
</body>
</html>
