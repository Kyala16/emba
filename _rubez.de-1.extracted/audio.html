<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/audio.css">
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="script/audio.js"></script>
</head>
<body style="background-color: #323232;">
<div id="div_audio_main">
    <div id="div_audio_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_audio" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_audio_text" class="cls_tablebar_item_text">Audio</div>
        </div>
    </div>
    <div id="div_note_audio_support" style="width: 800px;height: 24px;margin: 0 0 0 12px;float: left;display: none;">
        <p id="pnote_audio_support" class="cls_item_mini_font" style="color: red;">Note: This device does not support this feature.</p>
    </div>
    <div id="div_audio_content">
        <div id="div_audio_enable" class="cls_audio_content_item" style="height: 24px;">
            <input id="check_audio_enable" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
            <div style="float: left;height: 24px;">
                <label id="label_enable_audio" for="check_audio_enable" class="cls_item_mini_font cls_item_font_light">Enable audio</label>
            </div>
        </div>
        <div id="div_audio_codec" class="cls_audio_content_item">
            <div id="div_audio_codec_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name">Audio Codec Format:</div>
            <div id="div_audio_codec_select" class="cls_audio_content_item_value">
                <select class="cls_subpage_content_select" id="select_audio_codec" style="width: 200px;">
                    <option>G711U</option>
                </select>
            </div>
        </div>
		<div id="div_audio_sample_ratio" class="cls_audio_content_item">
            <div id="div_audio_sample_ratio_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name">Sample Ratio:</div>
            <div id="div_audio_sample_ratio_select" class="cls_audio_content_item_value">
                <select class="cls_subpage_content_select" id="select_audio_sample_ratio" style="width: 200px;">
                    <option>8000</option>
                </select>
            </div>
        </div>
        <div id="div_audio_bitrate" class="cls_audio_content_item">
            <div id="div_audio_bitrate_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name">Audio bit rate:</div>
            <div id="div_audio_bitrate_select" class="cls_audio_content_item_value">
                <select class="cls_subpage_content_select" id="select_audio_bitrate" style="width: 200px;">
                    <option></option>
                </select>
            </div>
        </div>
        <div id="div_audio_input" class="cls_audio_content_item">
            <div id="div_audio_input_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name">Audio In:</div>
            <div id="div_audio_input_select" class="cls_audio_content_item_value">
                <select class="cls_subpage_content_select" id="select_audio_input_type"  style="width: 200px;" disabled="disabled">
                    <option value="0">Line-in</option>
                    <option value="1">MIC In</option>
                </select>
            </div>
        </div>
        <div id="div_audio_input_volume" class="cls_audio_content_item" style="height: 24px;">
            <div id="div_audio_input_volume_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name" style="height: 22px;line-height: 22px;">Input Volume:</div>
            <div id="div_audio_input_volume_slider" class="cls_audio_content_item_value">
                <div id="slider_audio_input"></div>
            </div>
            <div id="div_audio_input_volume_value" class="cls_audio_content_slider_value" style="color: white;"></div>
            <div id="div_audio_input_volume_declare" class="cls_audio_content_slider_value_range cls_item_mini_font cls_item_font_grey">
                <label style="margin-top: 6px;">[0...100]</label>
            </div>
        </div>
        <div id="div_audio_output_volume" class="cls_audio_content_item" style="height: 24px;">
            <div id="div_audio_output_volume_name" class="cls_item_mini_font cls_item_font_light cls_audio_content_item_name" style="height: 22px;line-height: 22px;">Output Volume:</div>
            <div id="div_audio_output_volume_slider" class="cls_audio_content_item_value">
                <div id="slider_audio_output"></div>
            </div>
            <div id="div_audio_output_volume_value" class="cls_audio_content_slider_value" style="color: white;"></div>
            <div id="div_audio_output_volume_declare" class="cls_audio_content_slider_value_range  cls_item_mini_font cls_item_font_grey">
                <label style="margin-top: 6px;">[0...100]</label>
            </div>
        </div>
    </div>
    <div id="div_audio_options">
        <input type="button" class="cls_subpage_content_button" id="button_audio_reset" value="Reset">
        <input type="button" class="cls_subpage_content_button" id="button_audio_refresh" value="Refresh">
        <input type="button" class="cls_subpage_content_button" id="button_audio_save" value="Save">
    </div>
</div>
</body>
</html>
