<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/serialconfig.css">
    <script src="/script/jquery-3.5.1.min.js"></script>
    <script src="/script/bvipccgisdk.js"></script>
    <script src="/script/translator.js"></script>
    <script src="/script/inputrestriction.js"></script>
    <script src="script/serialconfig.js"></script>
</head>
<body>
<div id="div_serialconfig_main">
    <div id="div_serialconfig_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_serialconfig" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_serialconfig_text" class="cls_tablebar_item_text">RS485 Config</div>
        </div>
    </div>
    <div id="div_serialconfig_content">
        <div id="div_serialconfig_baudrate" class="cls_serialconfig_item">
            <div id="div_serialconfig_baudrate_name" class="cls_serialconfig_item_name">Baudrate</div>
            <div id="div_serialconfig_baudrate_value" class="cls_serialconfig_item_value">
                <select id="select_serialconfig_baudrate" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="2400">2400</option>
                    <option value="4800">4800</option>
                    <option value="9600">9600</option>
                    <option value="57600">57600</option>
                    <option value="19200">19200</option>
                    <option value="115200">115200</option>
                </select>
            </div>
        </div>
        <div id="div_serialconfig_databits" class="cls_serialconfig_item">
            <div id="div_serialconfig_databits_name" class="cls_serialconfig_item_name">Data bits</div>
            <div id="div_serialconfig_databits_value" class="cls_serialconfig_item_value">
                <select id="select_serialconfig_databits" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
        </div>
        <div id="div_serialconfig_stopbits" class="cls_serialconfig_item">
            <div id="div_serialconfig_stopbits_name" class="cls_serialconfig_item_name">Stop bits</div>
            <div id="div_serialconfig_stopbits_value" class="cls_serialconfig_item_value">
                <select id="select_serialconfig_stopbits" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
        </div>
        <div id="div_serialconfig_verify" class="cls_serialconfig_item">
            <div id="div_serialconfig_verify_name" class="cls_serialconfig_item_name">Parity</div>
            <div id="div_serialconfig_verify_value" class="cls_serialconfig_item_value">
                <select id="select_serialconfig_verify" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">None</option>
                    <option value="1">ODD</option>
                    <option value="2">EVEN</option>
                </select>
            </div>
        </div>
        <div id="div_serialconfig_datacontrol" class="cls_serialconfig_item">
            <div id="div_serialconfig_datacontrol_name" class="cls_serialconfig_item_name">Flow control</div>
            <div id="div_serialconfig_datacontrol_value" class="cls_serialconfig_item_value">
                <select id="select_serialconfig_datacontrol" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">Disable</option>
                    <option value="1">Enable</option>
                </select>
            </div>
        </div>
        <div id="div_serialconfig_send" class="cls_serialconfig_item">
            <div id="div_serialconfig_send_name" class="cls_serialconfig_item_name" style="height: 24px;line-height: 24px;">Data to send</div>
            <div id="div_serialconfig_send_value" class="cls_serialconfig_item_value" style="width: 216px;">
                <input id="input_serialconfig_send_value" class="cls_subpage_content_input" style="width:214px;" type="text" maxlength="128">
            </div>
        </div>
        <div id="div_serialconfig_send_radio" class="cls_serialconfig_item" style="height: 26px;">
            <div id="div_send_text" class="cls_serialconfig_send_item" style="margin-left: 100px;">
                <input type="radio" id="radio_send_text" class="cls_schedule_radio" name="serialconfig_send" style="margin-left: 0;" checked>
                <div style="float: left;height: 24px;">
                    <label for="radio_send_text" id="label_send_text" class="cls_item_mini_font cls_item_font_light">Text</label>
                </div>
            </div>
            <div id="div_send_hexadecimal" class="cls_serialconfig_send_item">
                <input type="radio" id="radio_send_hexadecimal" class="cls_schedule_radio" name="serialconfig_send" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label for="radio_send_hexadecimal" id="label_send_hexadecimal" class="cls_item_mini_font cls_item_font_light">Hexadecimal</label>
                </div>
            </div>
        </div>
        <div id="div_serialconfig_send_tips" class="cls_serialconfig_item" style="height: 20px;">
            <div id="div_send_tips" class="cls_serialconfig_send_item" style="margin-left: 100px;width: 100%;height: 20px;">
                <div id="div_send_tips_icon" style="float: left;height:20px;width:20px;">
                    <img src="images/tips.png">
                </div>
                <div id="label_send_tips_text" class="cls_serialconfig_send_check_item_name cls_item_mini_font cls_item_font_light" style="text-align: left;margin-left: 4px;float: left;height: 20px;line-height: 20px;">Hexadecimal should be seperated by spaces</div>
            </div>
        </div>
        <div id="div_serialconfig_options">
            <input type="button" id="button_serialconfig_reset" class="cls_subpage_content_button" value="Reset">
            <input type="button" id="button_serialconfig_refresh" class="cls_subpage_content_button" value="Refresh">
            <input type="button" id="button_serialconfig_save" class="cls_subpage_content_button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
