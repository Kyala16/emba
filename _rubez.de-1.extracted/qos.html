<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/qos.css"/>
    <link rel="stylesheet" media="all" href="css/subcommon.css"/>
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="script/qos.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
</head>
<body>
<div id="div_qos_main">
    <div id="div_qos_tablebar">
        <div id="div_table_qos" class="cls_tablebar_item cls_tablebar_item_selected">
            <div id="div_table_qos_text" class="cls_tablebar_item_text">QoS</div>
        </div>
    </div>
    <div id="div_qos_content">
        <div id="div_qos_enable" class="cls_qos_parameter_item" style="height: 24px;margin-left: 8px;">
            <input type="checkbox" id="check_enable_qos" class="cls_schedule_radio" style="float: left;">
            <div style="width: 240px;height: 24px;float: left;">
                <label for="check_enable_qos" id="div_qos_item_enable_name" class="cls_item_mini_font cls_item_font_light">Enable</label>
            </div>
        </div>
        <div id="div_qos_dscp_item" class="cls_qos_dscp_item">
            <div id="div_qos_dscp_setting" style="height: 30px;width: 100%;float: left;">
                <div id="div_qos_dscp_name_text" class="cls_qos_content_item_name" style="margin: 0 0 0 12px;float: left;width: 105px;height: 24px;line-height: 24px;">Stream DSCP</div>
                <input id="input_qos_dscp" maxlength="36" class="cls_subpage_content_input" style="float: left">
                <div id="div_qos_dscp_tips_text" class="cls_qos_dscp_item_tips cls_item_font_grey cls_item_mini_font">[1-63]</div>
            </div>
        </div>
        <div id="div_qos_name_operation" style="height: 40px;width: 100%;float: left;margin: 10px 0 0 0;">
            <input id="button_qos_name_restore" class="cls_subpage_content_button" type="button" style="margin-left: 12px;" value="Restore">
            <input id="button_qos_name_refresh" class="cls_subpage_content_button" type="button" value="Refresh">
            <input id="button_qos_name_save" class="cls_subpage_content_button" type="button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
