<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="css/alarminterface.css" />
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css" />
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="script/alarminterface.js"></script>
  </head>
  <body>
    <div id="div_interface_main">
      <div id="div_interface_tablebar">
        <div id="div_table_interface_status" class="cls_tablebar_item cls_tablebar_item_selected" style="width: 167px">
          <div id="div_table_interface_status_text" class="cls_tablebar_item_text">Alarm Interface</div>
        </div>
      </div>
      <div id="div_interface_context" class="cls_subpage_content">
        <div id="div_interface_hardware">
          <div id="div_interface_hardware_title" class="cls_subpage_content_title cls_general_content_title">
            <div id="div_interface_hardware_title_text" class="cls_general_content_title_text">硬件接口</div>
          </div>
          <div id="div_interface_hardware_content" style="width: 100%">
            <div id="div_interface_hardware_content_in" class="cls_general_content_item" style="margin-top: 5px">
              <div id="div_interface_hardware_in_name" class="cls_general_content_item_name">报警输入数：</div>
              <div id="div_interface_hardware_in_value" class="cls_general_content_item_value"></div>
            </div>
            <div id="div_interface_hardware_content_out" class="cls_general_content_item" style="margin-top: 0">
              <div id="div_interface_hardware_out_name" class="cls_general_content_item_name">报警输出数：</div>
              <div id="div_interface_hardware_out_value" class="cls_general_content_item_value"></div>
            </div>
          </div>
        </div>
        <div id="div_interface_state">
          <div id="div_interface_state_title" class="cls_subpage_content_title cls_general_content_title">
            <div id="div_interface_state_title_text" class="cls_general_content_title_text">接口状态</div>
          </div>
          <div id="div_interface_state_content" style="width: 100%">
            <div id="div_interface_state_content_in" class="cls_general_content_item" style="margin-top: 5px">
              <div id="div_interface_state_in_name" class="cls_general_content_item_name">输入：</div>
              <div id="div_interface_state_in_value" class="cls_general_content_item_value"></div>
            </div>
            <div id="div_interface_state_content_out" class="cls_general_content_item" style="margin-top: 0">
              <div id="div_interface_state_out_name" class="cls_general_content_item_name">输出：</div>
              <div id="div_interface_state_out_value" class="cls_general_content_item_value"></div>
            </div>
          </div>
        </div>
        <div id="div_interface_test">
          <div id="div_interface_test_title" class="cls_subpage_content_title cls_general_content_title">
            <div id="div_interface_test_title_text" class="cls_general_content_title_text">接口测试</div>
          </div>
          <div id="div_interface_test_content" style="width: 100%">
            <div id="div_interface_test_content_in" class="cls_general_content_item" style="margin-top: 5px">
              <div id="div_interface_test_in_name" class="cls_general_content_item_name">输入：</div>
              <div id="div_interface_test_in_value" class="cls_general_content_item_value"></div>
            </div>
            <div id="div_interface_test_content_date" class="cls_general_content_item">
              <div id="div_interface_test_name" class="cls_general_content_item_name">输出：</div>
              <div id="div_interface_test_value" class="cls_general_content_item_value" style="width: 240px">
                <select id="sel_test_out" class="cls_subpage_content_select">
                  <option value="0">Low</option>
                  <option value="1">High</option>
                </select>
              </div>
              <input id="button_devicetime_save" type="button" class="cls_subpage_content_button" value="Test" style="margin-top: -4px" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
