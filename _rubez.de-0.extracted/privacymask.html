<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="css/privacymask.css" />
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="/script/flvplayer/mpegts.js" charset="utf-8"></script>
    <link rel="stylesheet" media="all" href="/ui/css/mpegts.css" />
    <script src="script/privacymask.js"></script>
  </head>
  <body>
    <div id="div_privacymask_main">
      <div id="div_privacymask_titlebar" style="width: 100%; height: 36px; float: left">
        <div id="div_title_privacymask" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb; color: white">
          <div id="div_title_privacymask_text" class="cls_tablebar_item_text">Privacy Mask</div>
        </div>
      </div>
      <div id="div_privacymask_content">
        <div id="div_privacymask_enable">
          <input id="check_privacymask_enable" type="checkbox" class="cls_schedule_radio" style="margin-left: 0" onclick="fun_enable_privacy_mask_check()" />
          <div style="float: left; height: 24px; width: 220px">
            <label id="label_enable_privacy" for="check_privacymask_enable" class="cls_item_mini_font cls_item_font_light">Enable Privacy Mask</label>
          </div>
          <div id="div_privacymack_rect_declare" class="cls_item_mini_font">Maximum can only set 4 areas.</div>
        </div>
        <div id="div_privacymask_videoview">
          <div id="div_privacymask_video_player"></div>
          <div id="div_privacymask_draw_mask">
            <canvas id="canvas_draw_privacy_mask" style="-webkit-user-select: none"></canvas>
          </div>
        </div>
        <div id="div_privacymask_options">
          <input type="button" id="button_privacy_mask_clear" value="Clear" class="cls_subpage_content_button" />
          <input type="button" id="button_privacy_mask_save" value="Save" class="cls_subpage_content_button" />
        </div>
      </div>
    </div>
  </body>
</html>
