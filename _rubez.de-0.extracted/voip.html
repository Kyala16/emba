<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/voip.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/voip.js"></script>
</head>
<body>
<div id="div_voip_main">
    <div id="div_voip_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_voip" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_voip_text" class="cls_tablebar_item_text">VOIP</div>
        </div>
    </div>
    <div id="div_voip_content">
        <div id="div_voip_enable" class="cls_voip_item" style="height: 24px;">
            <div id="div_voip_enable_item" style="width: 480px;height: 24px;float: left;">
                <input id="check_enable_voip" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label id="div_voip_enable_name" for="check_enable_voip" class="cls_item_mini_font cls_item_font_light">Enable</label>
                </div>
            </div>
        </div>
        <div id="div_voip_auth_enable" class="cls_voip_item" style="height: 24px;">
            <div id="div_auth_enable_item" style="width: 480px;height: 24px;float: left;">
                <input id="check_enable_auth" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label id="div_voip_auth_enable_name" for="check_enable_auth" class="cls_item_mini_font cls_item_font_light">Enable</label>
                </div>
            </div>
        </div>
        <div id="div_voip_server_address" class="cls_voip_item">
            <div id="div_voip_server_address_name" class="cls_voip_item_name">Server Address</div>
            <div id="div_voip_server_address_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="text" id="input_voip_server_address" class="cls_subpage_content_input" style="float: left;border: none;">
                </div>
            </div>
        </div>
        <div id="div_voip_server_port" class="cls_voip_item">
            <div id="div_voip_server_port_name" class="cls_voip_item_name">Server Port</div>
            <div id="div_voip_server_port_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="number" id="input_voip_server_port" class="cls_subpage_content_input" maxlength="5" style="float: left;border: none;">
                </div>
            </div>
            <div id="div_voip_server_port_declare" class="cls_voip_item_declare cls_item_font_grey">[1~65535]</div>
        </div>
        <div id="div_voip_callid" class="cls_voip_item">
            <div id="div_voip_callid_name" class="cls_voip_item_name">Call ID</div>
            <div id="div_voip_callid_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="text" id="input_voip_callid" class="cls_subpage_content_input" maxlength="31" style="float: left;border: none;">
                </div>
            </div>
            <div id="div_voip_server_callid_declare" class="cls_voip_item_declare cls_item_font_grey">[Max 31bit]</div>
        </div>
        <div id="div_voip_username" class="cls_voip_item">
            <div id="div_voip_username_name" class="cls_voip_item_name">Username</div>
            <div id="div_voip_username_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="text" id="input_voip_username" class="cls_subpage_content_input" maxlength="31" style="float: left;border: none;">
                </div>
            </div>
            <div id="div_voip_user_name_declare" class="cls_voip_item_declare cls_item_font_grey">[Max 31bit]</div>
        </div>
        <div id="div_voip_password" class="cls_voip_item">
            <div id="div_voip_password_name" class="cls_voip_item_name">Password</div>
            <div id="div_voip_password_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="password" id="input_voip_password" class="cls_subpage_content_input" maxlength="31" style="float: left;border: none;">
                    <div id="div_password_eye" style="float: left;margin-left: 6px;">
                        <img class="cls_input_icon" id="password_eye_hide" onclick="fun_password_eye_showorhide(0)" style="margin-top: 7px;" src="../ui/images/weyehide.png">
                        <img class="cls_input_icon" id="password_eye_show" onclick="fun_password_eye_showorhide(1)" style="margin-top: 7px;" src="../ui/images/eyeshow.png" hidden>
                    </div>
                </div>
            </div>
            <div id="div_voip_password_declare" class="cls_voip_item_declare cls_item_font_grey">[Max 31bit]</div>
        </div>
        <div id="div_voip_stream_type" class="cls_voip_item">
            <div id="div_voip_stream_name" class="cls_voip_item_name" style="height: 22px;line-height: 22px;">Stream Type</div>
            <div id="div_voip_stream_value" class="cls_voip_item_value">
                <select id="select_voip_stream" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">Main Stream</option>
                    <option value="1">Sub Stream</option>
                </select>
            </div>
        </div>
        <div id="div_voip_maxcall_duration" class="cls_voip_item">
            <div id="div_voip_maxcall_duration_name" class="cls_voip_item_name">Max Call Duration</div>
            <div id="div_voip_maxcall_duration_value" class="cls_voip_item_value">
                <div style="width: 216px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="number" id="input_voip_maxcall_duration" class="cls_subpage_content_input" maxlength="4" style="float: left;border: none;">
                </div>
            </div>
            <div id="div_voip_maxcall_declare" class="cls_voip_item_declare cls_item_font_grey">[0...3600s]</div>
        </div>
        <div id="div_voip_options">
            <input type="button" id="button_voip_reset" class="cls_subpage_content_button" value="Reset">
            <input type="button" id="button_voip_refresh" class="cls_subpage_content_button" value="Refresh">
            <input type="button" id="button_voip_save" class="cls_subpage_content_button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
