<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="css/roi.css" />
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="/script/flvplayer/mpegts.js" charset="utf-8"></script>
    <link rel="stylesheet" media="all" href="/ui/css/mpegts.css" />
    <script src="script/roi.js"></script>
  </head>
  <body>
    <div id="div_roi_main">
      <div id="div_roi_titlebar" style="width: 100%; height: 36px; float: left">
        <div id="div_title_roi" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb; color: white">
          <div id="div_title_roi_text" class="cls_tablebar_item_text">ROI</div>
        </div>
      </div>
      <div id="div_roi_content">
        <div id="div_roi_enable">
          <input id="check_roi_enable" type="checkbox" class="cls_schedule_radio" style="margin-left: 0" onclick="fun_enableroi_check()" />
          <div style="float: left; height: 24px; width: 140px">
            <label id="lable_enable_roi" for="check_roi_enable" class="cls_item_mini_font cls_item_font_light">Enable ROI</label>
          </div>
          <div id="div_roi_rect_declare" class="cls_item_mini_font">Maximum can only set 4 areas.</div>
        </div>
        <!----------------------更改处------------------------------>
        <div id="div_roi_content_tips">
          <div style="width: 400px">
            <span id="div_roi_content_tips_level" style="display: inline-block; width: 154px"></span>
            <select id="id_roi_level_select" class="cls_subpage_content_select" style="width: 190px">
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
            </select>
          </div>
          <div style="margin-top: 5px" id="div_roi_nonfps" style="width: 400px">
            <span id="div_roi_content_tips_nonroifps" style="display: inline-block; width: 154px"></span>
            <select id="id_roi_nonfps_select" class="cls_subpage_content_select" style="width: 190px"></select>
          </div>
        </div>
        <!--***********************************************************-->
        <div id="div_roi_videoview">
          <div id="div_roi_video_player"></div>
          <div id="div_roi_draw_mask">
            <canvas id="canvas_draw_roi" width="640" height="360" style="-webkit-user-select: none"></canvas>
          </div>
        </div>
        <div id="div_roi_options">
          <input type="button" id="button_roi_clear" value="Clear" class="cls_subpage_content_button" />
          <input type="button" id="button_roi_save" value="Save" class="cls_subpage_content_button" />
        </div>
      </div>
    </div>
  </body>
</html>
