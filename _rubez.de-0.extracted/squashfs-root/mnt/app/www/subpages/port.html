<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/port.css">
    <link rel="stylesheet" media="all" href="/script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="script/port.js"></script>
</head>
<body>
<div id="div_server_port_main">
    <div id="div_server_port_tablebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_table_server_port" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_table_server_port_text" class="cls_tablebar_item_text">Server Port</div>
        </div>
    </div>
    <div id="div_server_port_items">
        <div id="div_rtsp_information_title" class="cls_subpage_content_title cls_port_title">
            <div id="div_rtsp_information_title_text" class="cls_port_title_text">Port settings</div>
        </div>
        <div id="div_server_port_item_http" class="cls_server_port_item" style="margin-top: 10px;">
            <div id="div_http_port_name" class="cls_server_port_item_name">
                <div id="div_http_port_name_text" class="cls_item_mini_font cls_item_font_light">HTTP Port</div>
            </div>
            <div id="div_http_port_value" class="cls_server_port_item_value">
                <input type="text" id="input_http_port" maxlength="5" class="cls_subpage_content_mini_input">
            </div>
            <div id="div_http_port_tips" class="cls_server_port_item_tips">
                <div id="div_http_port_tips_text" class="cls_item_font_grey cls_item_mini_font">[1..65535,default is 80]</div>
            </div>
        </div>
        <div id="div_server_port_item_https" class="cls_server_port_item">
            <div id="div_https_port_name" class="cls_server_port_item_name">
                <div id="div_https_port_name_text" class="cls_item_mini_font cls_item_font_light">HTTPS Port</div>
            </div>
            <div id="div_https_port_value" class="cls_server_port_item_value">
                <input type="text" id="input_https_port" maxlength="5" class="cls_subpage_content_mini_input">
            </div>
            <div id="div_https_port_tips" class="cls_server_port_item_tips">
                <div id="div_https_port_tips_text" class="cls_item_font_grey cls_item_mini_font">[1..65535,default is 443]</div>
            </div>
        </div>
        <div id="div_server_port_item_rtsp" class="cls_server_port_item">
            <div id="div_rtsp_port_name" class="cls_server_port_item_name">
                <div id="div_rtsp_port_name_text" class="cls_item_mini_font cls_item_font_light">RTSP Port</div>
            </div>
            <div id="div_rtsp_port_value" class="cls_server_port_item_value">
                <input type="text" id="input_rtsp_port" maxlength="5" class="cls_subpage_content_mini_input">
            </div>
            <div id="div_rtsp_port_tips" class="cls_server_port_item_tips">
                <div id="div_rtsp_port_tips_text" class="cls_item_font_grey cls_item_mini_font">[1..65535,default is 554]</div>
            </div>
        </div>
        <div id="div_server_port_item_tcp" class="cls_server_port_item">
            <div id="div_tcp_port_name" class="cls_server_port_item_name">
                <div id="div_tcp_port_name_text" class="cls_item_mini_font cls_item_font_light">TCP Port</div>
            </div>
            <div id="div_tcp_port_value" class="cls_server_port_item_value">
                <input type="text" id="input_tcp_port" maxlength="5" class="cls_subpage_content_mini_input">
            </div>
            <div id="div_tcp_port_tips" class="cls_server_port_item_tips">
                <div id="div_tcp_port_tips_text" class="cls_item_font_grey cls_item_mini_font">[1..65535,default is 6000]</div>
            </div>
        </div>
        <div id="div_server_prot_item_flash" class="cls_server_port_item">
            <div id="div_flash_port_name" class="cls_server_port_item_name">
                <div id="div_flash_port_name_text" class="cls_item_mini_font cls_item_font_light">FLASH Port</div>
            </div>
            <div id="div_flash_port_value" class="cls_server_port_item_value">
                <input type="text" id="input_flash_port" class="cls_subpage_content_mini_input" value="1935" readonly="readonly" maxlength="5">
            </div>
            <div id="div_rtmp_port_tips" class="cls_server_port_item_tips" style="display: none;">
                <div id="div_rtmp_port_tips_text" class="cls_item_font_grey cls_item_mini_font">[1..65535,default is 6000]</div>
            </div>
        </div>
    </div>
    <div id="div_server_protocol_items">
        <div id="div_protocol_information_title" class="cls_subpage_content_title cls_port_title">
            <div id="div_protocol_information_title_text" class="cls_port_title_text">Protocol settings</div>
        </div>
        <div id="div_protocol_items" style="width: 512px;height: 54px;">
            <div id="div_protocol_onvif" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_onvif" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_onvif_enable_name" for="check_enable_onvif" class="cls_item_mini_font cls_item_font_light">ONVIF</label>
                </div>
            </div>
            <div id="div_protocol_hk" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_hk" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_hi_enable_name" for="check_enable_hk" class="cls_item_mini_font cls_item_font_light">HK</label>
                </div>
            </div>
            <div id="div_protocol_dh" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_dh" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_dh_enable_name" for="check_enable_dh" class="cls_item_mini_font cls_item_font_light">DH</label>
                </div>
            </div>
            <div id="div_protocol_al" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_al" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_al_enable_name" for="check_enable_al" class="cls_item_mini_font cls_item_font_light">AL</label>
                </div>
            </div>
            <div id="div_protocol_xm" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_xm" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_xm_enable_name" for="check_enable_xm" class="cls_item_mini_font cls_item_font_light">XM</label>
                </div>
            </div>
            <div id="div_protocol_hb" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_hb" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_hb_enable_name" for="check_enable_hb" class="cls_item_mini_font cls_item_font_light">HB</label>
                </div>
            </div>
            <div id="div_protocol_ts" style="width: 106px;height: 20px;float: left;margin: 5px 0 0 8px;display: none;">
                <input id="check_enable_ts" class="cls_schedule_radio" type="checkbox" style="float: left">
                <div class="cls_protocol_item_name" style="float: left;height: 20px;">
                    <label id="div_ts_enable_name" for="check_enable_ts" class="cls_item_mini_font cls_item_font_light">TS</label>
                </div>
            </div>
        </div>
        <div id="div_note_reboot" style="width: 512px;height: 20px;line-height: 20px;float:left;">
            <p id="p_note_reboot" class="cls_item_mini_font" style="color:red;margin-left: 12px;margin-top: 0;">The device will reboot when it is changed.</p>
        </div>
    </div>
    <div id="div_tips_dialog" style="display: none;">
        <div id="div_tips_text" style="width: 328px;height: 78px;margin: 24px 10px;"></div>
        <div id="div_tips_options" style="width: 340px;height: 32px;">
            <input type="button" id="button_tips_confirm" value="Confirm" class="cls_subpage_content_button">
            <input type="button" id="button_tips_cancel" value="Cancel" class="cls_subpage_content_button">
        </div>
    </div>
    <div id="div_server_port_operation">
        <input type="button" id="button_server_port_restore" class="cls_subpage_content_button" value="Restore Default">
        <input type="button" id="button_server_port_refresh" class="cls_subpage_content_button" value="Refresh">
        <input type="button" id="button_server_port_save" class="cls_subpage_content_button" value="Save">
    </div>
</div>
</body>
</html>
