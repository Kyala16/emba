<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/bonjour.css"/>
    <link rel="stylesheet" media="all" href="css/subcommon.css"/>
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="script/bonjour.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
</head>
<body>
    <div id="div_bonjour_main">
        <div id="div_bonjour_tablebar">
            <div id="div_table_bonjour" class="cls_tablebar_item cls_tablebar_item_selected">
                <div id="div_table_bonjour_text" class="cls_tablebar_item_text">Bonjour</div>
            </div>
        </div>
        <div id="div_bonjour_content">
            <div id="div_bonjour_enable" class="cls_bonjour_parameter_item" style="height: 24px;margin-left: 8px;">
                <input type="checkbox" id="check_enable_bonjour" class="cls_schedule_radio" style="float: left;">
                <div style="width: 240px;height: 24px;float: left;">
                    <label for="check_enable_bonjour" id="div_bonjour_item_enable_name" class="cls_item_mini_font cls_item_font_light">Enable</label>
                </div>
            </div>
            <div id="div_bonjour_page_server" class="cls_subpage_content">
                <div id="div_server_name_setting" style="height: 30px;width: 100%;float: left;">
                    <div id="div_server_name_setting_name" class="cls_bonjour_content_item_name" style="margin: 0 0 0 12px;float: left;width: 140px;height: 24px;line-height: 24px;">Server Name</div>
                    <input id="input_server_name_setting_value" maxlength="32" class="cls_subpage_content_input" style="float: left">
                </div>
            </div>
            <div id="div_bonjour_name_operation" style="height: 40px;width: 100%;float: left;margin: 10px 0 0 0;">
                <input id="button_bonjour_name_restore" class="cls_subpage_content_button" type="button" style="margin-left: 12px;" value="Restore">
                <input id="button_bonjour_name_refresh" class="cls_subpage_content_button" type="button" value="Refresh">
                <input id="button_bonjour_name_save" class="cls_subpage_content_button" type="button" value="Save">
            </div>
        </div>
    </div>
</body>
</html>
