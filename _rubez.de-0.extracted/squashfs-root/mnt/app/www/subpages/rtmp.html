<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/rtmp.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/rtmp.js"></script>
</head>
<body>
<div id="div_rtmp_main">
    <div id="div_rtmp_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_rtmp" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_rtmp_text" class="cls_tablebar_item_text">RTMP</div>
        </div>
    </div>
    <div id="div_rtmp_content">
        <div id="div_rtmp_enable" class="cls_rtmp_item" style="height: 24px;">
            <div id="div_rtmp_enable_item" style="width: 480px;height: 24px;float: left;">
                <input id="check_enable_rtmp" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label id="div_rtmp_enable_name" for="check_enable_rtmp" class="cls_item_mini_font cls_item_font_light">Enable</label>
                </div>
            </div>
        </div>
        <div id="div_rtmp_schedule">
            <div id="div_schedule_timesection_one" class="cls_rtmP_schedule_item">
                <div id="div_schedule_timesection_one_name" class="cls_rtmp_item_name" style="width: 78px;height: 26px;line-height: 26px;">Section 1</div>
                <div id="div_schedule_timesection_one_start" class="cls_rtmp_schedule_item_value"></div>
                <div id="div_schedule_timesection_one_split" class="cls_rtmp_schedule_item_split">~</div>
                <div id="div_schedule_timesection_one_end" class="cls_rtmp_schedule_item_value"></div>
            </div>
            <div id="div_schedule_timesection_two" class="cls_rtmP_schedule_item">
                <div id="div_schedule_timesection_two_name" class="cls_rtmp_item_name" style="width: 78px;height: 26px;line-height: 26px;">Section 2</div>
                <div id="div_schedule_timesection_two_start" class="cls_rtmp_schedule_item_value"></div>
                <div id="div_schedule_timesection_two_split" class="cls_rtmp_schedule_item_split">~</div>
                <div id="div_schedule_timesection_two_end" class="cls_rtmp_schedule_item_value"></div>
            </div>
            <div id="div_schedule_timesection_three" class="cls_rtmP_schedule_item">
                <div id="div_schedule_timesection_three_name" class="cls_rtmp_item_name" style="width: 78px;height: 26px;line-height: 26px;">Section 3</div>
                <div id="div_schedule_timesection_three_start" class="cls_rtmp_schedule_item_value"></div>
                <div id="div_schedule_timesection_three_split" class="cls_rtmp_schedule_item_split">~</div>
                <div id="div_schedule_timesection_three_end" class="cls_rtmp_schedule_item_value"></div>
            </div>
            <div id="div_schedule_timesection_four" class="cls_rtmP_schedule_item">
                <div id="div_schedule_timesection_four_name" class="cls_rtmp_item_name" style="width: 78px;height: 26px;line-height: 26px;">Section 4</div>
                <div id="div_schedule_timesection_four_start" class="cls_rtmp_schedule_item_value"></div>
                <div id="div_schedule_timesection_four_split" class="cls_rtmp_schedule_item_split">~</div>
                <div id="div_schedule_timesection_four_end" class="cls_rtmp_schedule_item_value"></div>
            </div>
        </div>
        <div id="div_youtube_enable" class="cls_rtmp_item" style="height: 24px;">
            <div id="div_youtube_enable_item" style="width: 480px;height: 24px;float: left;">
                <input id="check_enable_youtube" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label id="div_youtube_enable_name" for="check_enable_youtube" class="cls_item_mini_font cls_item_font_light">YouTube compatible</label>
                </div>
            </div>
        </div>
        <div id="div_rtmp_stream_type" class="cls_rtmp_item">
            <div id="div_rtmp_stream_name" class="cls_rtmp_item_name" style="height: 22px;line-height: 22px;">Push Type</div>
            <div id="div_rtmp_stream_value" class="cls_rtmp_item_value">
                <select id="select_rtmp_stream" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">Main Stream</option>
                    <option value="1">Sub Stream</option>
                </select>
            </div>
        </div>
        <div id="div_rtmp_server_address" class="cls_rtmp_item">
            <div id="div_rtmp_server_address_name" class="cls_rtmp_item_name">Push URL</div>
            <div id="div_rtmp_server_address_value" class="cls_rtmp_item_value">
                <input type="text" id="input_rtmp_server_address" class="cls_subpage_content_input" style="width: 214px;">
            </div>
        </div>
        <div id="div_rtmp_options">
            <input type="button" id="button_rtmp_reset" class="cls_subpage_content_button" value="Reset">
            <input type="button" id="button_rtmp_refresh" class="cls_subpage_content_button" value="Refresh">
            <input type="button" id="button_rtmp_save" class="cls_subpage_content_button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
