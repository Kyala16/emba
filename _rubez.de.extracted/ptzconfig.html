<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/ptzconfig.css">
    <script src="/script/jquery-3.5.1.min.js"></script>
    <script src="/script/bvipccgisdk.js"></script>
    <script src="/script/translator.js"></script>
    <script src="/script/inputrestriction.js"></script>
    <script src="script/ptzconfig.js"></script>
</head>
<body>
<div id="div_ptzconfig_main">
    <div id="div_ptzconfig_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_ptzconfig" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_ptzconfig_text" class="cls_tablebar_item_text">PTZ Config</div>
        </div>
    </div>
    <div id="div_ptzconfig_content">
        <div id="div_ptzconfig_protocol" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_protocol_name" class="cls_ptzconfig_item_name">Protocol</div>
            <div id="div_ptzconfig_protocol_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_protocol" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="1">PELCO_D</option>
                    <option value="2">PELCO_P</option>
                </select>
            </div>
        </div>
        <div id="div_ptzconfig_address" class="cls_ptzconfig_item" style="height: 30px;">
            <div id="div_ptzconfig_address_name" class="cls_ptzconfig_item_name" style="height: 24px;line-height: 24px;">Address</div>
            <div id="div_ptzconfig_address_value" class="cls_ptzconfig_item_value">
                <input id="input_ptzconfig_address_value" class="cls_subpage_content_input" style="width:214px;" type="text">
            </div>
            <div id="div_ptzconfig_address_declare" class="cls_ptzconfig_item_decl cls_item_font_grey">[1-255]</div>
        </div>
        <div id="div_ptzconfig_baudrate" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_baudrate_name" class="cls_ptzconfig_item_name">Baudrate</div>
            <div id="div_ptzconfig_baudrate_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_baudrate" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="2400">2400</option>
                    <option value="4800">4800</option>
                    <option value="9600">9600</option>
                    <option value="57600">57600</option>
                    <option value="19200">19200</option>
                    <option value="115200">115200</option>
                </select>
            </div>
        </div>
        <div id="div_ptzconfig_databits" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_databits_name" class="cls_ptzconfig_item_name">Data bits</div>
            <div id="div_ptzconfig_databits_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_databits" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
        </div>
        <div id="div_ptzconfig_stopbits" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_stopbits_name" class="cls_ptzconfig_item_name">Stop bits</div>
            <div id="div_ptzconfig_stopbits_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_stopbits" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
        </div>
        <div id="div_ptzconfig_verify" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_verify_name" class="cls_ptzconfig_item_name">Verify</div>
            <div id="div_ptzconfig_verify_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_verify" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">None</option>
                    <option value="1">ODD</option>
                    <option value="2">EVEN</option>
                </select>
            </div>
        </div>
        <div id="div_ptzconfig_datacontrol" class="cls_ptzconfig_item">
            <div id="div_ptzconfig_datacontrol_name" class="cls_ptzconfig_item_name">Data Control</div>
            <div id="div_ptzconfig_datacontrol_value" class="cls_ptzconfig_item_value">
                <select id="select_ptzconfig_datacontrol" class="cls_subpage_content_select" style="width: 216px;">
                    <option value="0">Disable</option>
                    <option value="1">Enable</option>
                </select>
            </div>
        </div>
      <div id="div_ptzconfig_zoomshow" class="cls_ptzconfig_item" style="height: 24px">
        <input id="check_ptzconfig_zoomshow" type="checkbox" style="margin-left: 0; float: left" />
        <div style="float: left; height: 24px">
          <label id="label_zoomshow_ptzconfig" for="check_ptzconfig_zoomshow"
            class="cls_item_mini_font cls_item_font_light">Show Zoom value</label>
        </div>
      </div>
      <div id="div_ptzconfig_3d" class="cls_ptzconfig_item" style="height: 24px;display: none;"> 
        <input id="check_ptzconfig_3d" type="checkbox" style="margin-left: 0; float: left" />
        <div style="float: left; height: 24px">
          <label id="label_3d_ptzconfig" for="check_ptzconfig_3d" class="cls_item_mini_font cls_item_font_light">3D
            Positioning</label>
        </div>
      </div>
      <div id="div_ptzconfig_options">
        <input type="button" id="button_ptzconfig_reset" class="cls_subpage_content_button" value="Reset" />
        <input type="button" id="button_ptzconfig_refresh" class="cls_subpage_content_button" value="Refresh" />
        <input type="button" id="button_ptzconfig_save" class="cls_subpage_content_button" value="Save" />
      </div>
    </div>
</div>
</body>
</html>
