<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/pppoe.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/pppoe.js"></script>
</head>
<body>
<div id="div_pppoe_main">
    <div id="div_pppoe_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_pppoe" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_pppoe_text" class="cls_tablebar_item_text">PPPoE</div>
        </div>
    </div>
    <div id="div_pppoe_content">
        <div id="div_pppoe_enable" class="cls_pppoe_item" style="height: 24px;">
            <input id="check_enable_pppoe" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
            <div style="float: left;height: 24px;">
                <label id="label_enable_pppoe_declare" for="check_enable_pppoe" class="cls_item_mini_font cls_item_font_light">Enable PPPoE</label>
            </div>
        </div>
        <div id="div_pppoe_username" class="cls_pppoe_item">
            <div id="div_pppoe_username_name" class="cls_pppoe_item_name cls_item_font_light cls_item_mini_font">User Name:</div>
            <div id="div_pppoe_username_value" style="float: left;">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="text" class="cls_subpage_content_input" id="input_user_name" style="float: left;border: none;width: 225px">
                </div>
            </div>
        </div>
        <div id="div_pppoe_password" class="cls_pppoe_item">
            <div id="div_pppoe_password_name" class="cls_pppoe_item_name cls_item_font_light cls_item_mini_font">Password:</div>
            <div id="div_pppoe_password_value" style="float: left;">
                <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                    <input type="password" class="cls_subpage_content_input" id="input_password" style="float: left;border: none;width: 200px">
                    <div id="div_password_eye" style="float: left;margin-left: 6px;">
                        <img class="cls_input_icon" id="password_eye_hide" onclick="fun_password_eye_showorhide(0)" style="margin-top: 6px;" src="../ui/images/weyehide.png">
                        <img class="cls_input_icon" id="password_eye_show" onclick="fun_password_eye_showorhide(1)" style="margin-top: 6px;" src="../ui/images/eyeshow.png" hidden>
                    </div>
                </div>
            </div>
        </div>
        <div id="div_pppoe_connectstatus" class="cls_pppoe_item" style="height: 24px;line-height: 24px;">
            <div id="div_pppoe_connectstatus_name" class="cls_pppoe_item_name cls_item_font_light cls_item_mini_font">Connect Status:</div>
            <div id="div_pppoe_connectstatus_value" class="cls_item_mini_font cls_item_font_grey"></div>
        </div>
        <div id="div_pppoe_ipaddr" class="cls_pppoe_item" style="height: 24px;line-height: 24px;">
            <div id="div_pppoe_ipaddr_name" class="cls_pppoe_item_name cls_item_font_light cls_item_mini_font">IP Address:</div>
            <div id="div_pppoe_ipaddr_value" class="cls_item_mini_font cls_item_font_grey"></div>
        </div>
        <div id="div_pppoe_options" class="cls_pppoe_item" style="margin-top: 10px;">
            <input type="button" class="cls_subpage_content_button" id="button_pppoe_restore" value="Restore">
            <input type="button" class="cls_subpage_content_button" id="button_pppoe_refresh" value="Refresh">
            <input type="button" class="cls_subpage_content_button" id="button_pppoe_save" value="Save">
        </div>
    </div>
</div>
</body>
</html>
