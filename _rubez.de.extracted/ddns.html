<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/ddns.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script SRC="../script/inputrestriction.js"></script>
    <script src="script/ddns.js"></script>
</head>

<body>
    <div id="div_ddns_main">
        <div id="div_ddns_titlebar" style="width: 100%;height: 36px;float: left;">
            <div id="div_title_ddns" class="cls_tablebar_item cls_tablebar_item_selected"
                style="border-bottom: 4px solid #1baafb;color:white;">
                <div id="div_title_ddns_text" class="cls_tablebar_item_text">DDNS</div>
            </div>
        </div>
        <div id="div_ddns_content">
            <div id="div_ddns_item_enable" class="cls_ddns_item" style="height: 24px;">
                <div id="div_ddns_enable_item" style="width: 480px;height: 24px;float: left;">
                    <input id="check_enable_ddns" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                    <div style="float: left;height: 24px;">
                        <label id="div_ddns_item_enable_name" for="check_enable_ddns"
                            class="cls_item_mini_font cls_item_font_light">Enable UPnP</label>
                    </div>
                </div>
            </div>

            <div id="div_ddns_item_autoddns" class="cls_ddns_item" style="margin-top: 10px;">
                <div id="div_ddns_network_mode_select" class="cls_network_setting_item_value" style="height: 24px;">
                    <input type="radio" id="radio_ddns_mode_auto" class="cls_schedule_radio" name="ddnsmode"
                        value="ddns" style="margin-left: 0px;">
                    <div style="float: left;height: 24px;margin-left: 5px;">
                        <label for="radio_ddns_mode_auto" id="lable_ddns_mode_auto"
                            class="cls_item_mini_font cls_item_font_light">Auto DDNS</label>
                    </div>

                </div>
            </div>

            <div style="margin-left: 20px;">
                <div id="div_ddns_item_hostname" class="cls_ddns_item">
                    <div id="div_ddns_item_hostname_name" class="cls_ddns_item_name"
                        style="height: 22px;line-height: 22px;width: 70px;">Host name:</div>
                    <div id="div_ddns_item_hostname_value"
                        style="color: rgb(123,185,51);font-size: 12px;line-height: 24px;float: left;">
                        eizddns.mysecuritycamera.com</div>
                </div>
            </div>

            <div id="div_ddns_item_manualddns" class="cls_ddns_item">
                <div id="div_ddns_network_mode_select" class="cls_network_setting_item_value" style="height: 24px;">
                    <input type="radio" id="radio_ddns_mode_manual" class="cls_schedule_radio" name="ddnsmode"
                        value="ddns" style="margin-left: 0px;">
                    <div style="float: left;height: 24px;margin-left: 5px;">
                        <label for="radio_ddns_mode_manual" id="lable_ddns_mode_manual"
                            class="cls_item_mini_font cls_item_font_light">Manual DDNS</label>
                    </div>
                </div>
            </div>

            <div style="margin-left: 20px;">
                <div id="div_ddns_item_servertype" class="cls_ddns_item">
                    <div id="div_ddns_item_servertype_name" class="cls_ddns_item_name"
                        style="height: 22px;line-height: 22px;">Server Type</div>
                    <div id="div_ddns_item_servertype_value" class="cls_ddns_item_value">
                        <select id="select_ddns_item_servertype" class="cls_subpage_content_select">
                            <option value="0">3322</option>
                            <option value="1">Oray</option>
                            <option value="2">Dyndns</option>
                            <option value="3">NO-IP</option>
                        </select>
                    </div>
                </div>
                <div id="div_ddns_item_serverdomain" class="cls_ddns_item">
                    <div id="div_ddns_item_serverdomain_name" class="cls_ddns_item_name">Server Domain</div>
                    <div id="div_ddns_item_serverdomain_value" class="cls_ddns_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_ddns_serverdomain" maxlength="28"
                                class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_ddns_item_username" class="cls_ddns_item">
                    <div id="div_ddns_item_username_name" class="cls_ddns_item_name">User Name</div>
                    <div id="div_ddns_item_username_value" class="cls_ddns_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_ddns_username" maxlength="20" class="cls_subpage_content_input"
                                style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_ddns_item_password" class="cls_ddns_item">
                    <div id="div_ddns_item_password_name" class="cls_ddns_item_name">Password</div>
                    <div id="div_ddns_item_password_value" class="cls_ddns_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="password" id="input_ddns_password" maxlength="20"
                                class="cls_subpage_content_input" style="float: left;border: none;">
                            <div id="div_password_eye" style="float: left;margin-left: 6px;">
                                <img class="cls_input_icon" id="password_eye_hide"
                                    onclick="fun_password_eye_showorhide(0)" style="margin-top: 6px;"
                                    src="../ui/images/weyehide.png">
                                <img class="cls_input_icon" id="password_eye_show"
                                    onclick="fun_password_eye_showorhide(1)" style="margin-top: 6px;"
                                    src="../ui/images/eyeshow.png" hidden>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="div_ddns_item_interval" class="cls_ddns_item">
                    <div id="div_ddns_item_interval_name" class="cls_ddns_item_name">Update Interval</div>
                    <div id="div_ddns_item_interval_value" class="cls_ddns_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_ddns_interval" maxlength="2" class="cls_subpage_content_input"
                                style="float: left;border: none;">
                        </div>
                    </div>
                    <div id="div_ddns_item_interval_declare" class="cls_ddns_item_declare">Minute[1~10]</div>
                </div>
            </div>


            <div id="div_ddsn_options">
                <input type="button" id="button_ddns_restore" class="cls_subpage_content_button" value="Restore">
                <input type="button" id="button_ddns_refresh" class="cls_subpage_content_button" value="Refresh">
                <input type="button" id="button_ddns_save" class="cls_subpage_content_button" value="Save">
            </div>
        </div>
    </div>
</body>

</html>
