        function getQT(e) {
            qt_ws = e;
            // console.log(e);
        }
        /***
         * 选择文件夹路径
        */
        function BrowseSelectFile(val) {
            // console.log(e);
            const videoPath = $('#input_local_record_path_show').val();
            const imagePath = $('#input_local_snapshot_path_show').val();
            qt_ws.openFileSelect(val, {
                imagefile: imagePath,
                videofile: videoPath
            }, e => {
                const { imagefile, videofile } = e;
                console.log(e);
                if (imagefile) {
                    $('#input_local_snapshot_path_show').val(imagefile);
                }
                if (videofile) {
                    $('#input_local_record_path_show').val(videofile);
                }
            })
        }

         * 保存所选路径
