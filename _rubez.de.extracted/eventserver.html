<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/eventserver.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/eventserver.js"></script>
</head>
<body>
<div id="div_event_server_main">
    <div id="div_event_server_tablebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_table_event_server" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
                <div id="div_table_event_server_text" class="cls_tablebar_item_text">Event Server</div>
            </div>
        </div>
        <div id="div_event_server_content">
            <div id="div_evtserver_one" class="cls_evtserver_index" style="border-bottom: none;">
                <div id="div_smtp_server_auth" class="cls_event_server_item" style="height: 28px;">
                    <div id="div_evtserver_type_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light" style="height: 22px;line-height: 22px;">Type</div>
                    <div id="div_evtserver_type_one_value" class="cls_evtserver_item_value">
                        <select id="select_evtserver_type_one" class="cls_subpage_content_select" style="width: 230px;">
                            <option value="0">Private</option>
                            <option value="1">HTTP</option>
                            <option value="2">UDP</option>
                            <option value="3">MQTT</option>
                        </select>
                    </div>
                </div>
                <div id="div_evtserver_one_alias" class="cls_event_server_item">
                    <div id="div_evtserver_alias_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Alias</div>
                    <div id="div_evtserver_alias_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_alias_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_smtp_server_dataFormat" class="cls_event_server_item" style="height: 28px;">
                    <div id="div_evtserver_dataFormat_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light" style="height: 22px;line-height: 22px;">Data Format</div>
                    <div id="div_evtserver_dataFormat_value" class="cls_evtserver_item_value">
                        <select id="select_evtserver_dataFormat" class="cls_subpage_content_select" style="width: 230px;">
                            <option value="0">XML</option>
                            <option value="1">JSON</option>
                        </select>
                    </div>
                </div>
                <!-- div_action_alertServe_one -->
                <div id="div_action_alertServe_one">
                    <input type="checkbox" id="check_action_alertServe_one" class="cls_schedule_radio" style="float: left; margin-left: 0" />
                    <div style="width: 240px; height: 24px; float: left">
                        <!-- <label for="check_action_alertServe_one" id="label_action_alertServe_one" class="cls_item_font_light" style="font-size: 14px;">Alert Server 1</label> -->
                        <label for="check_action_alertServe_one" id="label_action_alertServe_one" class="cls_item_font_light" style="font-size: 14px;">
                            <span id="label_action_alertServe_one_name">Alert server</span>
                            <span style="margin-left: 5px;">#1</span>
                        </label>
                    </div>
                </div>
                <div id="div_evtserver_address_one" class="cls_event_server_item">
                    <div id="div_evtserver_address_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Server Address</div>
                    <div id="div_evtserver_address_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_address_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_evtserver_one_port" class="cls_event_server_item">
                    <div id="div_evtserver_port_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Port</div>
                    <div id="div_evtserver_port_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_port_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <!-- div_action_alertServe_two 22222-->
                <div id="div_action_alertServe_two">
                    <input type="checkbox" id="check_action_alertServe_two" class="cls_schedule_radio" style="float: left; margin-left: 0" />
                    <div style="width: 240px; height: 24px; float: left">
                        <!-- <label for="check_action_alertServe_two" id="label_action_alertServe_two" class="cls_item_font_light" style="font-size: 14px;">Alert Server 2</label> -->
                        <label for="check_action_alertServe_two" id="label_action_alertServe_two" class="cls_item_font_light" style="font-size: 14px;">
                            <span id="label_action_alertServe_two_name">Alert server</span>
                            <span style="margin-left: 5px;">#2</span>
                        </label>
                    </div>
                </div>
                <div id="div_evtserver_address_two" class="cls_event_server_item">
                    <div id="div_evtserver_address_two_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Server Address</div>
                    <div id="div_evtserver_address_two_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_address_two_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_evtserver_two_port" class="cls_event_server_item">
                    <div id="div_evtserver_port_two_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Port</div>
                    <div id="div_evtserver_port_two_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_port_two_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <!-- USER + PASSWORD -------------!!!!!!!!!!!!z -->
                <div style="font-size: 14px;color: white;margin: 6px 0;float: left;" id="server_confidential">Server confidential</div>
                <div id="div_evtserver_one_username" class="cls_event_server_item">
                    <div id="div_evtserver_username_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">User name</div>
                    <div id="div_evtserver_username_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_username_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_evtserver_one_password" class="cls_event_server_item">
                    <div id="div_evtserver_password_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Password</div>
                    <div id="div_evtserver_password_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="password" id="input_event_server_password_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                            <div id="div_password_eye" style="float: left;margin-left: 6px;">
                                <img class="cls_input_icon" id="password_eye_hide" onclick="fun_password_eye_showorhide(0)" style="margin-top: 6px;" src="../ui/images/weyehide.png">
                                <img class="cls_input_icon" id="password_eye_show" onclick="fun_password_eye_showorhide(1)" style="margin-top: 6px;" src="../ui/images/eyeshow.png" hidden>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="div_evtserver_one_url" class="cls_event_server_item">
                    <div id="div_evtserver_url_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Post URL</div>
                    <div id="div_evtserver_url_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_url_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
                <div id="div_evtserver_one_clientid" class="cls_event_server_item" style="display: none;">
                    <div id="div_evtserver_clientid_one_name" class="cls_evtserver_item_name cls_item_mini_font cls_item_font_light">Client id</div>
                    <div id="div_evtserver_clientid_one_value" class="cls_evtserver_item_value">
                        <div style="width: 230px;height: 22px;background-color: #2f2f2f;border: 1px solid #242424;">
                            <input type="text" id="input_event_server_clientid_one_text" class="cls_subpage_content_input" style="float: left;border: none;">
                        </div>
                    </div>
                </div>
            </div>
            <div id="div_evtserver_options" class="cls_event_server_item" style="margin-top: 10px;">
                <input type="button" id="button_event_server_restore" class="cls_subpage_content_button" value="Restore">
                <input type="button" id="button_event_server_test" class="cls_subpage_content_button" value="Test">
                <input type="button" id="button_event_server_save" class="cls_subpage_content_button" value="Save">
            </div>
        </div>
    </div>
</body>
</html>
