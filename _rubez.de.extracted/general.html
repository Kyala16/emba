<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="css/general.css"/>
    <link rel="stylesheet" media="all" href="css/subcommon.css"/>
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="script/general.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
</head>
<body>
    <div id="div_general_main">
        <div id="div_general_tablebar">
            <div id="div_table_device" class="cls_tablebar_item cls_tablebar_item_selected">
                <div id="div_table_device_text" class="cls_tablebar_item_text">General</div>
            </div>
        </div>
        <div id="div_general_page_device" class="cls_subpage_content">
            <div id="div_device_name_setting" style="height: 30px;width: 100%;float: left;margin: 8px 0 0 0;">
                <div id="div_device_name_setting_name" class="cls_general_content_item_name" style="margin: 0 0 0 12px;float: left;">Device Name</div>
                <input id="input_device_name_setting_value" maxlength="36" CLASS="cls_subpage_content_input" style="float: left" value="">
            </div>
            <div id="div_device_lens_selfchk" style="height: 28px;width: 100%;float: left;margin: 5px 0 0 0;display: none;">
                <div id="div_device_lens_selfchk_name" class="cls_general_content_item_name" style="margin: 0 0 0 12px;float: left;">AF LENS Initialization after reboot</div>
                <select id="select_device_lens_selfchk" class="cls_subpage_content_select">
                    <option value="0">Disable</option>
                    <option value="1">Enable</option>
                </select>
            </div>
            <div id="div_device_name_operation" style="height: 40px;width: 100%;float: left;margin: 10px 0 0 0;">
                <input id="button_device_name_refresh" class="cls_subpage_content_button" type="button" style="margin-left: 12px" value="Refresh">
                <input id="button_device_name_save" class="cls_subpage_content_button" type="button" value="Save">
            </div>
            <div id="div_device_qrcode" style="display: none;">
                <div id="div_device_qrcode_title" class="cls_subpage_content_title cls_general_content_title">
                    <div id="div_device_qrcode_title_text" class="cls_general_content_title_text">Mobile P2P</div>
                </div>
                <div class="cls_general_content_item">
                    <div id="div_p2p_enable" class="cls_general_content_item_name" style="float: left;width: 100px;">Enable:</div>
                    <div class="cls_general_content_item_value" style="width: 89px;">
                        <select id="select_device_p2penable" class="cls_subpage_content_select" style="width: 88px;float: left;">
                            <option value="0">Disabled</option>
                            <option value="1">Enabled</option>
                        </select>
                    </div>
                    <p id="pnote_p2p_enable" class="cls_item_mini_font" style="float: left;margin-left:4px;color: rgb(123, 185, 51);line-height: 0;">This value changes and the device will restart.</p>
                </div>
                <div class="cls_general_content_item" style="display: none;margin-top: 5px;">
                    <div id="div_device_p2pnumber_name" class="cls_general_content_item_name" style="width:100px;">P2P ID:</div>
                    <div id="div_device_p2pnumber_value" class="cls_general_content_item_value" style="line-height: 20px;">
                        <label id="lable_device_p2pnumber">8888888888888888888</label>
                    </div>
                </div>
                <div id="div_device_qrcode_image" style="float:left;margin: 0 0 0 120px;width: 170px;height: 170px;background-color: #2f2f2f;display: none;">
                    <img src="../logo/qrcode.png" style="width: 160px;height: 160px;margin: 5px 0 0 5px;">
                </div>
            </div>
        </div>
    </div>
    <div id="div_reboot_tips" style="display: none;">
        <div id="div_reboot_tips_content">
            Change the setting will cause that the device will reboot. Do you want to continue?
        </div>
        <div id="div_reboot_tips_options">
            <input type="button" id="button_tips_dialog_confirm" value="Confirm" class="cls_subpage_content_button">
            <input type="button" id="button_tips_dialog_cancel"  value="Cancel"  class="cls_subpage_content_button">
        </div>
    </div>
</body>
</html>
