<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/snapshot.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/snapshot.js"></script>
</head>
<body>
<div id="div_snapshot_main">
    <div id="div_snapshot_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_snapshot" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_snapshot_text" class="cls_tablebar_item_text">Snapshot</div>
        </div>
    </div>
    <div id="div_snapshot_content">
        <div id="div_snapshot_items">
            <div id="div_snapshot_support_status" class="cls_snapshot_item" style="display: none;">
                <p id="pnote_snapshot_support" class="cls_item_mini_font" style="color: red;">Note: This device does not support this feature.</p>
            </div>
            <div id="div_snapshot_quality" class="cls_snapshot_item">
                <div id="div_snapshot_quality_name" class="cls_snapshot_item_name">Quality</div>
                <div id="div_snapshot_quality_value" class="cls_snapshot_item_value">
                    <select id="select_snapshot_quality" class="cls_subpage_content_select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>
            </div>
            <div id="div_snapshot_framerate" class="cls_snapshot_item">
                <div id="div_snapshot_framerate_name" class="cls_snapshot_item_name">Frame Rate</div>
                <div id="div_snapshot_framerate_value" class="cls_snapshot_item_value">
                    <select id="select_snapshot_framerate" class="cls_subpage_content_select"></select>
                </div>
                <div id="div_framerate_declare" class="cls_item_font_grey cls_item_mini_font" style="height: 22px;line-height: 22px;float: left;margin-left: 4px;">FPS</div>
            </div>
            <div id="div_snapshot_interval" class="cls_snapshot_item" style="height: 30px;">
                <div id="div_snapshot_interval_name" class="cls_snapshot_item_name" style="height: 24px;line-height: 24px;">Interval</div>
                <div id="div_snapshot_interval_value" class="cls_snapshot_item_value">
                    <input type="text" id="input_snapshot_interval" class="cls_subpage_content_input" style="width: 230px;">
                </div>
                <div id="div_snapshot_interval_range" class="cls_snapshot_item_declare cls_item_font_grey cls_item_mini_font" style="margin-left: 4px;">Second(1~600)</div>
            </div>
            <div id="div_snapshot_stream" class="cls_snapshot_item">
                <div id="div_snapshot_stream_name" class="cls_snapshot_item_name">Stream Type</div>
                <div id="div_snapshot_stream_value" class="cls_snapshot_item_value">
                    <select id="select_snapshot_streamtype" class="cls_subpage_content_select">
                        <option value="0">Main-Stream</option>
                        <option value="1">Sub-Stream</option>
                    </select>
                </div>
            </div>
            <div id="div_snapshot_mjpeg" class="cls_snapshot_item" style="height: 24px;">
                <div id="div_snapshot_mjpeg_name" class="cls_snapshot_item_name" style="height: 24px;line-height: 24px;">MJPEG-HTTP</div>
                <div id="div_snapshot_mjpeg_value" class="cls_snapshot_item_value cls_item_mini_font cls_item_font_light" style="width: 604px;height: 24px;line-height: 24px;"></div>
            </div>
            <div id="div_snapshot_url" class="cls_snapshot_item" style="height: 24px;">
                <div id="div_snapshot_url_name" class="cls_snapshot_item_name" style="height: 24px;line-height: 24px;">Snapshot URL</div>
                <div id="div_snapshot_url_value" class="cls_snapshot_item_value cls_item_mini_font cls_item_font_light" style="width: 604px;height: 24px;line-height: 24px;"></div>
            </div>
        </div>
        <div id="div_snapshot_options">
            <input type="button" id="button_snapshot_restore" class="cls_subpage_content_button" value="Restore Default">
            <input type="button" id="button_snapshot_refresh" class="cls_subpage_content_button" value="Refresh">
            <input type="button" id="button_snapshot_save" class="cls_subpage_content_button" value="Save">
        </div>
        <div id="div_url_creating_tips" class="cls_item_mini_font cls_item_font_grey">
            <p id="p_url_note">The User and Password showing in the above URLs are factory default. Please use the camera's current username and password in the appropriate locations.</p>
        </div>
    </div>
</div>
</body>
</html>
