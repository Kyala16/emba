<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/nfs.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/nfs.js"></script>
</head>
<body>
    <div id="div_nfs_main">
        <div id="div_nfs_tablebar" style="width: 100%;height: 36px;float: left;">
            <div id="div_table_nfs" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
                <div id="div_table_nfs_text" class="cls_tablebar_item_text">NFS</div>
            </div>
        </div>
        <div id="div_nfs_content">
            <div id="div_nfs_enable" class="cls_nfs_item" style="height: 24px;">
                <input id="check_enable_nfs" type="checkbox" class="cls_schedule_radio" style="margin-left: 0;">
                <div style="float: left;height: 24px;">
                    <label id="div_nfs_enable_name" for="check_enable_nfs" class="cls_item_mini_font cls_item_font_light">Enable</label>
                </div>
            </div>
            <div id="div_nfs_host" class="cls_nfs_item">
                <div id="div_nfs_host_name" class="cls_nfs_item_name">Host address</div>
                <div id="div_nfs_host_value"  class="cls_nfs_item_value">
                    <input id="input_nfs_host" type="text" style="float: left;" class="cls_subpage_content_input">
                </div>
            </div>
            <div id="div_nfs_path" class="cls_nfs_item">
                <div id="div_nfs_path_name" class="cls_nfs_item_name">Path</div>
                <div id="div_nfs_path_value">
                    <input id="input_nfs_path" type="text" class="cls_subpage_content_input">
                </div>
            </div>
            <div id="div_nfs_status" class="cls_nfs_item" style="height: 24px;">
                <div id="div_nfs_status_name" class="cls_nfs_item_name">Status</div>
                <div id="div_nfs_status_value" style="color: #7f7f7f;height: 24px;line-height: 24px;float: left;" class="cls_item_mini_font"></div>
            </div>
            <div id="div_mfs_options" class="cls_nfs_item" style="margin:10px 0 0 0;">
                <input type="button" id="button_nfs_restore" class="cls_subpage_content_button" value="Reset Default">
                <input type="button" id="button_nfs_refresh" class="cls_subpage_content_button" value="Refresh">
                <input type="button" id="button_nfs_save" class="cls_subpage_content_button" value="Save">
            </div>
        </div>
    </div>
</body>
</html>
