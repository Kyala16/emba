<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css" />
    <link rel="stylesheet" media="all" href="/script/jqueryui/jquery-ui.min.css" />
    <link rel="stylesheet" media="all" href="css/peoplecounting.css" />
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/jqueryui/datepicker-ru.js"></script>
    <script src="../script/jqueryui/datepicker-zh.js"></script>
    <script src="../script/jqueryui/datepicker-de.js"></script>
    <script src="../script/jqueryui/datepicker-ja.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/videodrawx.js"></script>
    <script src="../script/normalschedule.js"></script>
    <script src="/script/flvplayer/mpegts.js" charset="utf-8"></script>
    <link rel="stylesheet" media="all" href="/ui/css/mpegts.css" />
    <script src="../script/timeredit.js"></script>
    <script src="script/peoplecounting.js"></script>
  </head>
  <body>
    <div id="div_main">
      <div id="div_peoplecount_tablebar">
        <div id="div_table_peoplecount_region" class="cls_tablebar_item cls_tablebar_item_selected">
          <div id="div_table_peoplecount_region_text" class="cls_tablebar_item_text">Base Settings</div>
        </div>
        <div id="div_table_peoplecount_ftpcfg" class="cls_tablebar_item">
          <div id="div_table_peoplecount_ftpcfg_text" class="cls_tablebar_item_text">Report to FTP</div>
        </div>
        <div id="div_table_peoplecount_reportcfg" class="cls_tablebar_item">
          <div id="div_table_peoplecount_reportcfg_text" class="cls_tablebar_item_text">Quota for report</div>
        </div>
      </div>
      <div id="div_page_content">
        <!--区域设置-->
        <div id="div_page_region">
          <div id="div_page_base_parameters" style="display: block">
            <div id="div_page_peoplecount_enable" style="height: 28px">
              <div id="div_page_peoplecount_enable_text" class="cls_page_item_name">Enable:</div>
              <div id="div_page_peoplecount_enable_value" class="cls_item_value">
                <select id="select_peoplecount_enable" class="cls_subpage_content_select">
                  <option value="0">Disable</option>
                  <option value="1">Enable</option>
                </select>
              </div>
            </div>
            <div id="div_page_peoplecount_mode" style="height: 28px">
              <div id="div_page_peoplecount_mode_text" class="cls_page_item_name">Number of lines:</div>
              <div id="div_page_peoplecount_mode_value" class="cls_item_value">
                <select id="select_peoplecount_mode" class="cls_subpage_content_select">
                  <option value="1">1</option>
                  <option value="2">2</option>
                </select>
              </div>
            </div>
            <div id="div_peoplecount_derection" class="cls_base_param_item">
              <div id="div_peoplecount_derection_name" class="cls_page_item_name">Direction</div>
              <select id="select_peoplecount_derection" class="cls_subpage_content_select" style="width: 150px">
                <option value="0">A -> B</option>
                <option value="1">B -> A</option>
              </select>
            </div>
          </div>
          <!--人头数清空-->
          <div id="div_reset_count" style="margin-left: 10px">
            <div id="div_reset_coun_text" class="cls_page_item_name" style="width: 100%; font-size: 14px; font-weight: 600">Reset Counters</div>
            <div style="width: 645px"><hr style="background-color: #a1a1a1" /></div>
            <div id="div_autoreset_enable" class="cls_general_content_item" style="margin-top: 10px; margin-bottom: 10px">
              <input id="input_autoreset_enable" class="cls_schedule_radio" type="checkbox" />
              <div style="float: left; width: 140px; margin-left: 10px">
                <label id="label_autoreset_set" class="cls_item_mini_font cls_item_font_light" for="input_autoreset_enable">Auto Reset</label>
              </div>
              <div id="div_reset_time_weekday">
                <select id="sel_reset_time_weekday" style="width: 180px; height: 20px; margin: 5px 0 0 0; float: left">
                  <option value="7">Everday</option>
                  <option value="0">Monday</option>
                  <option value="1">Tuesday</option>
                  <option value="2">Wednesday</option>
                  <option value="3">Thursday</option>
                  <option value="4">Friday</option>
                  <option value="5">Saturday</option>
                  <option value="6">Sunday</option>
                </select>
              </div>
              <div id="timer_reset_time" style="color: #ffffff !important; width: 100px; height: 20px; background-color: #323232; margin: 10px 0 0 6px; float: left"></div>
            </div>
            <div style="margin-bottom: 10px">
              <input type="button" id="button_manual_reset" class="cls_subpage_content_button" style="width: 150px" value="Manual Reset" onclick="manualreset()" />
              <span id="reset_infotip" style="margin-left: 15px; font-size: 12px; color: #ffffff"> To reset the counter to start from zero</span>
            </div>
          </div>
          <!---->
          <div id="div_video_view">
            <div id="div_page_media_area">
              <div id="div_page_video_draw_shade"></div>
              <div id="div_page_video_draw"></div>
            </div>
            <div id="div_region_options">
              <input id="button_region_clear" type="button" class="cls_subpage_content_button" value="Clear" />
              <input id="button_region_refresh" type="button" class="cls_subpage_content_button" value="Refresh" style="display: none" />
              <input id="button_region_fullscreen" type="button" class="cls_subpage_content_button" value="Full screen" />
              <input id="button_region_restore" type="button" class="cls_subpage_content_button" value="Restore" />
              <input id="button_region_save" type="button" class="cls_subpage_content_button" value="Save" />
            </div>
          </div>
        </div>
        <div id="div_page_report_ftp" style="display: none">
          <div id="div_page_report_ftp_enable" class="cls_schedule_item">
            <div id="div_page_reportftp_enable_text" class="cls_page_item_name" style="width: 185px">Report sending to FTP:</div>
            <div id="div_page_reportftp_enable_value" class="cls_item_value">
              <select id="select_reportftp_enable" class="cls_subpage_content_select">
                <option value="0">Disable</option>
                <option value="1">Enable</option>
              </select>
            </div>
          </div>
          <div id="div_page_schedule_once" class="cls_schedule_item" style="margin-top: 0; height: 24px">
            <input type="radio" id="radio_schedule_once" name="normal_schedule" class="cls_schedule_radio" style="margin-left: 0" checked />
            <div style="float: left; width: auto">
              <label id="label_schedule_once" for="radio_schedule_once" class="cls_item_mini_font cls_item_font_light">Once a day</label>
            </div>
          </div>
          <div id="div_page_report_ftp_timing" class="cls_schedule_item" style="margin-top: 0; height: 24px; display: none">
            <div id="div_page_reportftp_timing_text" class="cls_page_item_name" style="width: 170px; height: 20px; line-height: 20px; margin-left: 15px">Time for report sending:</div>
            <div id="div_page_reportftp_timing_value" class="cls_item_value">
              <div id="timer_reportftp_timing" style="color: #ffffff; width: 230px; background-color: #323232; float: left"></div>
            </div>
          </div>
          <!-- 上传计划 -->
          <div id="div_page_schedule_time" class="cls_schedule_item" style="margin-top: 0; height: 24px">
            <input type="radio" id="radio_schedule_time" name="normal_schedule" class="cls_schedule_radio" style="margin-left: 0" />
            <div style="float: left; width: auto">
              <label id="label_schedule_time" for="radio_schedule_time" class="cls_item_mini_font cls_item_font_light">Schedule</label>
            </div>
          </div>
          <!-- 计划条 -->
          <div id="div_page_schedule_canvas" class="cls_schedule_item" style="margin-top: 0; height: 65px; margin-left: 15px; display: none">
            <div class="xaxis"></div>
            <div class="canvasbox">
              <canvas id="cavsElem" style="cursor: pointer; width: 528px; height: 22px"></canvas>
              <input type="button" id="button_canvas_selectall" class="cls_subpage_content_button" style="width: 130px; margin-left: 20px" value="全选" onclick="selectall()" />
              <input type="button" id="button_canvas_selectclear" class="cls_subpage_content_button" style="width: 130px; margin-left: 5px" value="清除" onclick="disableall()" />
            </div>
          </div>
          <!-- 上传计划结束 -->
          <div id="div_page_report_ftp_sendtimes" class="cls_schedule_item" style="margin-top: 0">
            <div id="div_page_reportftp_times_text" class="cls_page_item_name" style="width: 185px">Attempts of report sending:</div>
            <div id="div_page_reportftp_times_value" class="cls_item_value">
              <select id="select_reportftp_times" class="cls_subpage_content_select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
          </div>
          <div id="div_page_reportftp_option" class="cls_page_schedule_options">
            <input type="button" id="button_reportftp_restore" class="cls_subpage_content_button" value="Restore default" />
            <input type="button" id="button_reportftp_refresh" class="cls_subpage_content_button" value="Refresh" />
            <input type="button" id="button_reportftp_save" class="cls_subpage_content_button" value="Save" />
          </div>
        </div>
        <div id="div_page_quota_report" style="display: none">
          <div id="div_page_quotareport_search" class="cls_schedule_item">
            <div id="div_page_quotareport_text" class="cls_page_item_name" style="height: 24px; line-height: 24px; margin-top: 3px">Quota for report:</div>
            <input id="input_quotareport_start_date" class="cls_subpage_content_input" style="float: left; width: 138px; margin-top: 3px" type="text" readonly />
            <div id="div_page_quotareport_to_text" class="cls_page_item_name" style="width: 46px; text-align: center; height: 24px; line-height: 24px; margin-top: 3px">To</div>
            <input id="input_quotareport_end_date" class="cls_subpage_content_input" style="float: left; width: 138px; margin-top: 3px" type="text" readonly />
            <input type="button" id="button_quotareport_search" class="cls_subpage_content_button" style="float: right" value="Search" />

            <a id="link" style="visibility: hidden"></a>
          </div>
          <div id="div_page_quotareport_list" style="width: 862px; height: 256px; margin: 10px 0 0 12px; float: left">
            <div id="div_report_list_header">
              <table style="border: 1px solid black; width: 860px; height: 22px">
                <tbody>
                  <tr style="padding: 0">
                    <th id="list_column_target_file" class="cls_report_list_header_item" style="border-right: 1px solid black">File</th>
                    <th id="list_column_report_sendingtime" class="cls_report_list_header_item" style="border-right: 1px solid black">Report sending time</th>
                    <th id="list_column_upload_status" class="cls_report_list_header_item" style="border-right: 1px solid black">Uploaded status</th>
                    <th id="list_column_manual_export" class="cls_report_list_header_item" style="border-right: 1px solid black">Export to PC</th>
                    <th id="list_column_manual_send" class="cls_report_list_header_item" style="width: 140px">Send to FTP</th>
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="div_report_list_content">
              <div id="div_report_list_items" class="cls_scrollbar">
                <table>
                  <tbody id="table_report_mapping_list" style="width: 160px"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
