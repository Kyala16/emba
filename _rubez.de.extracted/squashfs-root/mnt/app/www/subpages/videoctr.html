<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/videoctr.css">
    <script src="/script/jquery-3.5.1.min.js"></script>
    <script src="/script/bvipccgisdk.js"></script>
    <script src="/script/translator.js"></script>
    <script src="script/videoctr.js"></script>
</head>
<body>
<div id="div_videoctr_main">
    <div id="div_videoctr_titlebar">
        <div id="div_title_videoctr" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_videoctr_text" class="cls_tablebar_item_text">Video control</div>
        </div>
    </div>
    <div id="div_videoctr_content">
        <div id="div_pre_record" class="cls_videoctr_item">
            <div id="div_pre_record_name" class="cls_videoctr_item_name">Pre-Record</div>
            <div id="div_pre_record_value" class="cls_videoctr_item_value">
                <select id="select_record_presecond" class="cls_subpage_content_select">
                    
                </select>
            </div>
        </div>
        <div id="div_record_stream" class="cls_videoctr_item">
            <div id="div_record_stream_name" class="cls_videoctr_item_name">Stream</div>
            <div id="div_record_stream_value" class="cls_videoctr_item_value">
                <select id="select_record_stream_type" class="cls_subpage_content_select">
                    <option value="0">Main-Stream</option>
                    <option value="1">Sub-Stream</option>
                </select>
            </div>
        </div>
        <div id="div_record_destination" class="cls_videoctr_item">
            <div id="div_record_destination_name" class="cls_videoctr_item_name">Destination</div>
            <div id="div_record_destination_value" class="cls_videoctr_item_value">
                <select id="select_record_destination_type" class="cls_subpage_content_select">
                    <option value="0">SD</option>
                    <option value="1">NFS</option>
                </select>
            </div>
        </div>
        <div id="div_record_package" class="cls_videoctr_item">
            <div id="div_record_package_name" class="cls_videoctr_item_name">Record Package</div>
            <div id="div_record_package_value" class="cls_videoctr_item_value">
                <select id="select_record_package" class="cls_subpage_content_select">
                    <option value="180">3 minute</option>
                    <option value="300">5 minute</option>
                    <option value="600">10 minute</option>
                </select>
            </div>
        </div>
        <div id="div_record_overwrite" class="cls_videoctr_item" style="height: 24px;">
            <input id="check_enable_record_overwrite" type="checkbox" class="cls_videoctr_radio" style="margin-left: 0;">
            <div style="float: left;height: 24px;">
                <label id="div_record_overwrite_name" for="check_enable_record_overwrite" class="cls_item_mini_font cls_item_font_light">overwrite</label>
            </div>
        </div>
        <div id="div_videoctr_options">
            <input type="button" id="button_restore" class="cls_subpage_content_button" value="Restore">
            <input type="button" id="button_refresh" class="cls_subpage_content_button" value="Refresh">
            <input type="button" id="button_save" class="cls_subpage_content_button" value="Save">
        </div>
    </div>
</div>
</body>
</html>
