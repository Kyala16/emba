<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="pragma" content="no-cache">
    <title></title>
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/disk.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/translator.js"></script>
    <script src="script/disk.js"></script>
</head>
<body>
<div id="div_disk_main">
    <div id="div_disk_tablebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_table_disk" class="cls_tablebar_item cls_tablebar_item_selected">
            <div id="div_table_disk_text" class="cls_tablebar_item_text">Storage Disk</div>
        </div>
    </div>
    <div id="div_disk_content">
        <div id="div_disk_status" class="cls_disk_normal_item">
            <div id="div_disk_status_name" class="cls_disk_normal_item_name">Status:</div>
            <div id="div_disk_status_value" class="cls_disk_normal_item_value">Mounted</div>
        </div>
        <div id="div_disk_formated" class="cls_disk_normal_item">
            <div id="div_disk_formated_name" class="cls_disk_normal_item_name">Formatted:</div>
            <div id="div_disk_formated_value" class="cls_disk_normal_item_value">Yes</div>
        </div>
        <div id="div_disk_usage">
            <div id="div_disk_usage_name" class="cls_disk_normal_item_name">Usage Status:</div>
            <div id="div_disk_usage_status" >
                <div id="div_disk_usage_diagram">
                    <canvas id="canvas_disk_usage"></canvas>
                </div>
                <div id="div_disk_usage_status_value">
                    <div id="div_disk_usage_value_area">
                        <div id="div_disk_usage_color" class="cls_disk_color_block" style="background-color: #97b9e0"></div>
                        <div id="div_disk_usage_value" class="cls_disk_usage_value">0GB(0%)</div>
                        <div id="div_disk_total_color" class="cls_disk_color_block" style="background-color: #5089bc"></div>
                        <div id="div_disk_total_value" class="cls_disk_usage_value">0GB(0%)</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="div_wait_format" style="display: none;">
            <div id="div_wait_icon" style="height: 80px;width: 100%;margin: 22px 0 0 0;float: left">
                <img width="58" height="58" style="margin-left: 108px;" src="../ui/images/wait.gif">
            </div>
            <div id="div_wait_value" class="cls_item_mini_font cls_item_font_light">Wait for formatting to complete...</div>
        </div>
        <div id="div_disk_options" class="cls_disk_normal_item">
            <div style="margin: 0 0 0 100px;width: 100%;height: 32px;float: left;">
                <input type="button" id="button_disk_refresh" class="cls_subpage_content_button" value="Refresh">
                <input type="button" id="button_disk_format" class="cls_subpage_content_button" value="Format">
            </div>
        </div>
        <div id="div_disk_record_note" style="border:0px solid white;width: 658px;height:72px;float: left;margin-left: 100px;margin-top: 10px;color:#7f7f7f;font-family: Arial;font-size: 12px;"></div>
    </div>
    <div id="div_format_tips_dialog" style="display: none;">
        <div id="div_format_tips_text" style="width: 313px;height: 70px;margin: 40px 0 0 24px;float: left;"></div>
        <div id="div_format_tips_options" style="width: 340px;height: 32px;margin: 10px 0 0 10px;float: left;">
            <input type="button" id="button_format_confirm" class="cls_subpage_content_button" value="OK">
            <input type="button" id="button_format_cancel" class="cls_subpage_content_button" value="Cancel">
        </div>
    </div>
</div>
</body>
</html>
