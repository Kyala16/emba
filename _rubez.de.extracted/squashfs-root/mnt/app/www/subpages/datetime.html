<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" media="all" href="css/subcommon.css">
    <link rel="stylesheet" media="all" href="css/datetime.css">
    <link rel="stylesheet" media="all" href="../script/jqueryui/jquery-ui.min.css">
    <script src="../script/jquery-3.5.1.min.js"></script>
    <script src="../script/jqueryui/jquery-ui.min.js"></script>
    <script src="../script/jqueryui/datepicker-zh.js"></script>
    <script src="../script/jqueryui/datepicker-ru.js"></script>
    <script src="../script/jqueryui/datepicker-pl.js"></script>
    <script src="../script/jqueryui/datepicker-ja.js"></script>
    <script src="../script/jqueryui/datepicker-de.js"></script>
    <script src="../script/bvipccgisdk.js"></script>
    <script src="../script/timeredit.js"></script>
    <script src="../script/translator.js"></script>
    <script src="../script/inputrestriction.js"></script>
    <script src="script/datetime.js"></script>
</head>
<body>
<div id="div_datetime_main">
    <div id="div_datetime_titlebar" style="width: 100%;height: 36px;float: left;">
        <div id="div_title_datetime" class="cls_tablebar_item cls_tablebar_item_selected" style="border-bottom: 4px solid #1baafb;color:white;">
            <div id="div_title_datetime_text" class="cls_tablebar_item_text">Date &amp; Time</div>
        </div>
    </div>
    <div id="div_datetime_contect"  class="cls_subpage_content">
        <div id="div_general_page_datetime" class="cls_subpage_content">
            <div id="div_datetime_status">
                <div id="div_datetime_status_title" class="cls_subpage_content_title cls_general_content_title">
                    <div id="div_datetime_status_title_text" class="cls_general_content_title_text">Status</div>
                </div>
                <div id="div_datetime_status_content" style="width: 100%">
                    <div id="div_datetime_status_content_date" class="cls_general_content_item" style="margin-top: 5px;">
                        <div id="div_datetime_date_name" class="cls_general_content_item_name">Date</div>
                        <div id="div_datetime_date_value" class="cls_general_content_item_value"></div>
                    </div>
                    <div id="div_datetime_status_content_time" class="cls_general_content_item" style="margin-top: 0;">
                        <div id="div_datetime_time_name" class="cls_general_content_item_name">Time</div>
                        <div id="div_datetime_time_value" class="cls_general_content_item_value"></div>
                    </div>
                </div>
            </div>
            <div id="div_datetime_format">
                <div id="div_datetime_format_title" class="cls_subpage_content_title cls_general_content_title" style="margin-top: 0;">
                    <div id="div_datetime_format_title_text" class="cls_general_content_title_text">Date & Time Format</div>
                </div>
                <div id="div_datetime_foramt_content" style="width: 100%">
                    <div id="div_datetime_format_content_date" class="cls_general_content_item">
                        <div id="div_datetime_dateformat_name" class="cls_general_content_item_name">Date Format</div>
                        <div id="div_datetime_dateformat_value" class="cls_general_content_item_value">
                            <select id="sel_date_format" class="cls_subpage_content_select">
                                <option value="0">YYYY-MM-DD</option>
                                <option value="1">MM-YYYY-DD</option>
                                <option value="2">DD-MM-YYYY</option>
                            </select>
                        </div>
                    </div>
                    <div id="div_datetime_format_content_time" class="cls_general_content_item" style="margin-top: 5px;">
                        <div id="div_datetime_timeformat_name" class="cls_general_content_item_name">Time Format</div>
                        <div id="div_datetime_timeformat_value" class="cls_general_content_item_value">
                            <select id="sel_time_format" class="cls_subpage_content_select">
                                <option value="0">24H</option>
                                <option value="1">12H</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div id="div_devicetime">
                <div id="div_devicetime_title" class="cls_subpage_content_title cls_general_content_title">
                    <div id="div_devicetime_title_text" class="cls_general_content_title_text">Device Time Settings</div>
                </div>
                <div id="div_devicetime_content" style="width: 100%">
                    <div id="div_devicetime_content_date" class="cls_general_content_item">
                        <div id="div_devicetime_name" class="cls_general_content_item_name">Time Zone</div>
                        <div id="div_devicetime_value" class="cls_general_content_item_value">
                            <select id="sel_time_zone" class="cls_subpage_content_select">

                            </select>
                        </div>
                    </div>
                </div>
                <div id="div_devicetime_dst" style="wdith:100%">
                    <div id="div_devicetime_dst_enable" class="cls_general_content_item" style="margin-left: 20px;margin-top: 0;">
                        <input id="input_dst_enable" class="cls_schedule_radio" type="checkbox"/>
                        <div style="float: left;width: auto;height: 24px;">
                            <label id="label_dst_enable" class="cls_item_mini_font cls_item_font_light" for="input_dst_enable">Enable DST</label>
                        </div>
                    </div>
                    <div id="div_devicetime_dst_item">
                        <div id="div_dst_bias">
                            <div id="div_dst_bias_name">
                                <div id="div_bias_name_text" style="float: left;margin: 0 0 0 40px; width: 140px;height: 22px;line-height: 22px;" class="cls_item_mini_font cls_item_font_light">DST Bias</div>
                            </div>
                            <div id="div_dst_bias_value">
                                <select id="sel_dst_bias" class="cls_subpage_content_select">
                                    <option value="0">30 Minute</option>
                                    <option value="1">60 Minute</option>
                                    <option value="2">90 Minute</option>
                                    <option value="3">120 Minute</option>
                                </select>
                            </div>
                        </div>
                        <div id="div_dst_start_time" style="width: 100%;height: auto;float: left">
                            <div id="div_dst_start_time_name">
                                <div id="div_dst_start_time_name_text" style="float: left;margin: 5px 0 0 40px; width: 140px;height: 22px;line-height: 22px;" class="cls_item_mini_font cls_item_font_light">Start Time</div>
                            </div>
                            <div id="div_dst_start_time_month">
                                <select id="sel_dst_start_month" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0"></option>
                                    <option value="1"></option>
                                    <option value="2"></option>
                                    <option value="3"></option>
                                    <option value="4"></option>
                                    <option value="5"></option>
                                    <option value="6"></option>
                                    <option value="7"></option>
                                    <option value="8"></option>
                                    <option value="9"></option>
                                    <option value="10"></option>
                                    <option value="11"></option>
                                </select>
                            </div>
                            <div id="div_dst_start_time_day">
                                <select id="sel_dst_start_day" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0">1</option>
                                    <option value="1">2</option>
                                    <option value="2">3</option>
                                    <option value="3">4</option>
                                    <option value="4">5</option>
                                </select>
                            </div>
                            <div id="div_dst_start_time_weekday">
                                <select id="sel_dst_start_weekday" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0">Monday</option>
                                    <option value="1">Tuesday</option>
                                    <option value="2">Wednesday</option>
                                    <option value="3">Thursday</option>
                                    <option value="4">Friday</option>
                                    <option value="5">Saturday</option>
                                    <option value="6">Sunday</option>
                                </select>
                            </div>
                            <div id="timer_dst_start_time" style="color: #ffffff;width: 100px;height: 20px;background-color: #323232;margin:5px 0 0 6px;float: left">
                            </div>
                        </div>
                        <div id="div_dst_end_time" style="width: 100%;height: auto;float: left">
                            <div id="div_dst_end_time_name">
                                <div id="div_dst_end_time_name_text" style="float: left;margin: 5px 0 0 40px; width: 140px;height: 22px;line-height: 22px;" class="cls_item_mini_font cls_item_font_light">End Time</div>
                            </div>
                            <div id="div_dst_end_time_month">
                                <select id="sel_dst_end_month" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0"></option>
                                    <option value="1"></option>
                                    <option value="2"></option>
                                    <option value="3"></option>
                                    <option value="4"></option>
                                    <option value="5"></option>
                                    <option value="6"></option>
                                    <option value="7"></option>
                                    <option value="8"></option>
                                    <option value="9"></option>
                                    <option value="10"></option>
                                    <option value="11"></option>
                                </select>
                            </div>
                            <div id="div_dst_end_time_day">
                                <select id="sel_dst_end_day" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0">1</option>
                                    <option value="1">2</option>
                                    <option value="2">3</option>
                                    <option value="3">4</option>
                                    <option value="4">5</option>
                                </select>
                            </div>
                            <div id="div_dst_end_time_weekday">
                                <select id="sel_dst_end_weekday" style="width: 90px;height: 20px;margin: 5px 0 0 0; float: left">
                                    <option value="0">Monday</option>
                                    <option value="1">Tuesday</option>
                                    <option value="2">Wednesday</option>
                                    <option value="3">Thursday</option>
                                    <option value="4">Friday</option>
                                    <option value="5">Saturday</option>
                                    <option value="6">Sunday</option>
                                </select>
                            </div>
                            <div id="timer_dst_end_time" style="color: #ffffff;width: 100px;height: 20px;background-color: #323232;margin:5px 0 0 6px;float: left">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="div_devicetime_ntp" style="width: 100%;height: 128px;">
                    <div id="div_devicetime_ntp_enable" class="cls_general_content_item" style="margin-top: 0;margin-left: 20px;">
                        <input id="input_ntp_enable" class="cls_schedule_radio" type="checkbox"/>
                        <div style="float: left;width: auto;height: 24px;">
                            <label id="label_ntp_syncserver" class="cls_item_mini_font cls_item_font_light" for="input_ntp_enable">Sync With NTP Server</label>
                        </div>
                    </div>
                    <div id="div_ntp_server_addr" style="width: 100%;height: 24px;float: left;">
                        <div id="div_ntp_server_addr_name" style="float: left;margin: 0 0 0 40px; width: 140px;height: 24px;line-height: 24px;" class="cls_item_mini_font cls_item_font_light">NTP Server</div>
                        <input id="input_ntp_server_addr" class="cls_subpage_content_input" maxlength="32" style="margin-top: 0;" type="text"/>
                    </div>
                    <div id="div_ntp_server_port" style="width: 100%;height: 24px;float: left;">
                        <div id="div_ntp_server_port_name" style="float: left;margin: 5px 0 0 40px; width: 140px;height: 24px;line-height: 24px;" class="cls_item_mini_font cls_item_font_light">Port</div>
                        <input id="input_ntp_server_port" class="cls_subpage_content_input" maxlength="5" style="margin-top: 5px;" type="number"/>
                    </div>
                    <div id="div_ntp_server_interval" style="width: 100%;height: 24px;float: left;">
                        <div id="div_ntp_server_interval_name" style="float: left;margin: 10px 0 0 40px; width: 140px;height: 24px;line-height: 24px;" class="cls_item_mini_font cls_item_font_light">Update Period</div>
                        <input id="input_ntp_server_interval" class="cls_subpage_content_input" style="margin-top: 10px;float: left;" maxlength="1" type="number"/>
                        <div id="div_ntp_server_interval_tips" style="float: left;margin: 10px 0 0 4px;height: 24px;line-height: 24px;" class="cls_item_mini_font cls_item_font_grey">Minutes(1~30)</div>
                    </div>
                </div>
                <div id="div_devicetime_manualset" style="width: 100%;height: 40px;">
                    <div id="div_devicetime_manual_enable" class="cls_general_content_item" style="margin-top: 20px;margin-left: 20px;">
                        <input id="input_manual_enable" class="cls_schedule_radio" type="checkbox"/>
                        <div style="float: left;width: 140px;height: 24px;">
                            <label id="label_manual_set" class="cls_item_mini_font cls_item_font_light" for="input_manual_enable">Manually Set</label>
                        </div>
                        <input id="input_manual_date" class="cls_subpage_content_input" style="float: left;width: 118px;margin-top: -3px;" type="text" readonly/>
                        <div id="timer_manual_settime" style="color: #ffffff;width: 100px;height: 22px;background-color: #323232;margin:-3px 0 0 6px;float: left"></div>
                        <input id="input_syncpc_enable" class="cls_schedule_radio" type="checkbox"/>
                        <div style="float: left;width: 100px;height: 24px;">
                            <label id="lable_sync_pc" class="cls_item_mini_font cls_item_font_light" for="input_syncpc_enable">Sync This PC Time</label>
                        </div>
                    </div>
                </div>
            </div>
            <div id="div_devicetime_operation">
                <div id="div_devicetime_operation_title" class="cls_subpage_content_title cls_general_content_title" style="height: 42px;background-color: transparent;">
                    <input id="button_devicetime_restore" type="button" class="cls_subpage_content_button" style="margin:5px 0 0 14px" value="Reset Default">
                    <input id="button_devicetime_refresh" type="button" class="cls_subpage_content_button" value="Refresh">
                    <input id="button_devicetime_save" type="button" class="cls_subpage_content_button" value="Save">
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
